<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makers Platform | Front de inversiones</title>
<style>

/* ============================================================
   MAKERS PLATFORM — DESIGN SYSTEM (single source of truth)
   Colores muestreados de la plataforma real. Edita SOLO las
   variables :root para reajustar la marca; no toques los
   componentes salvo que cambie el diseño base.
   ============================================================ */

:root {
  /* ---- Marca ---- */
  --mk-primary:        #6A1B9A;   /* morado principal (navbar logo, headers de tabla, botones) */
  --mk-primary-strong: #76279B;   /* morado de filtros / iconos de tarjeta */
  --mk-primary-dark:   #581580;   /* hover */
  --mk-primary-50:     #F4ECF8;   /* fondos suaves / botón deshabilitado */
  --mk-primary-100:    #EADBF7;   /* bordes lavanda de tarjetas */
  --mk-primary-200:    #E0CBF0;

  /* ---- Semánticos ---- */
  --mk-success:   #15803D;  --mk-success-soft:#DCFCE7;
  --mk-danger:    #DC2626;  --mk-danger-soft: #FEE2E2;
  --mk-warning:   #D97706;  --mk-warning-soft:#FEF3C7;
  --mk-info:      #3981F6;  --mk-info-soft:   #DBEAFE;
  --mk-neutral:   #64748B;  --mk-neutral-soft:#F1F5F9;  /* badge "Natural" */
  --mk-slate-btn: #607088;  /* botones secundarios: Limpiar, CSV */
  --mk-excel:     #0F783E;  /* botón Excel */

  /* ---- Superficies y texto ---- */
  --mk-bg:        #FDFAFF;  /* fondo de página */
  --mk-surface:   #FFFFFF;  /* tarjetas */
  --mk-border:    #EADBF7;  /* borde general */
  --mk-border-2:  #E5E7EB;  /* borde neutro (inputs, tablas) */
  --mk-text:      #1F2937;  /* texto principal */
  --mk-text-muted:#6B7280;  /* texto secundario */
  --mk-text-faint:#9CA3AF;  /* placeholders */

  /* ---- Forma ---- */
  --mk-radius:    10px;   /* tarjetas */
  --mk-radius-sm: 7px;    /* inputs, botones */
  --mk-radius-pill: 999px;/* badges */
  --mk-shadow:    0 1px 3px rgba(106,27,154,.06), 0 1px 2px rgba(0,0,0,.04);
  --mk-shadow-lg: 0 10px 30px rgba(31,41,55,.18);

  /* ---- Tipografía ---- */
  --mk-font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; font-family: var(--mk-font); color: var(--mk-text);
  background: var(--mk-bg); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--mk-primary); }

/* ============================================================
   MOLECULE · Navbar  (barra superior blanca)
   ============================================================ */
.mk-navbar { overflow: visible;
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  height: 56px; padding: 0 18px;
  background: var(--mk-surface);
  border-bottom: 1px solid var(--mk-border);
}
.mk-navbar__burger {
  display: grid; place-items: center; width: 38px; height: 34px;
  border: 1px solid var(--mk-primary-100); border-radius: var(--mk-radius-sm);
  background: var(--mk-surface); color: var(--mk-primary); cursor: pointer;
}
.mk-navbar__burger:hover { background: var(--mk-primary-50); }
.mk-brand { font-size: 18px; color: #111; }
.mk-brand b { font-style: italic; font-weight: 800; color: #111; }

/* ============================================================
   ATOM · Breadcrumb
   ============================================================ */
/* ---------- Catálogo de informes: tarjeta de categoría y tarjetas de reporte ----------
   Reutiliza los tokens de marca y el mismo lenguaje visual del Accordion,
   la DataTable y la LinkCard de la Plataforma. */
.mk-catcard{ border:1px solid var(--mk-primary-100); border-radius:var(--mk-radius); overflow:hidden;
  background:var(--mk-surface); box-shadow:var(--mk-shadow); margin-bottom:18px; }
.mk-catcard__head{ display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;
  font-weight:600; background:var(--mk-surface); }
.mk-catcard.open .mk-catcard__head{ background:var(--mk-primary); color:#fff; }
.mk-catcard__ico{ width:36px; height:36px; border-radius:var(--mk-radius-sm); display:flex; align-items:center;
  justify-content:center; background:var(--mk-primary-50); color:var(--mk-primary); flex:0 0 auto; }
.mk-catcard.open .mk-catcard__ico{ background:rgba(255,255,255,.18); color:#fff; }
.mk-catcard__t{ font-weight:700; font-size:14px; }
.mk-catcard__n{ font-size:12.5px; opacity:.85; font-weight:500; }
.mk-catcard__chev{ margin-left:auto; transition:transform .2s; }
.mk-catcard.open .mk-catcard__chev{ transform:rotate(180deg); }
.mk-catcard__body{ padding:16px; max-height:520px; overflow-y:auto; border-top:1px solid var(--mk-border); }
.mk-catcard__sub{ font-weight:600; color:var(--mk-primary); font-size:12.5px; text-transform:uppercase;
  letter-spacing:.04em; margin:4px 0 12px; }
.mk-repgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:14px; margin-bottom:6px; }
.mk-repcard{ display:block; text-align:center; border:1px solid var(--mk-border); border-radius:var(--mk-radius);
  padding:16px 18px; background:var(--mk-surface); cursor:pointer;
  transition:border-color .15s, box-shadow .15s; }
.mk-repcard:hover{ border-color:var(--mk-primary); box-shadow:var(--mk-shadow); }
.mk-repcard__t{ color:var(--mk-primary); font-weight:600; font-size:13.5px; margin-bottom:8px;
  display:flex; align-items:center; justify-content:center; gap:8px; }
.mk-repcard__t .chev{ margin-left:auto; color:var(--mk-text-faint); }
.mk-repcard__d{ font-size:12.5px; color:var(--mk-text-muted); line-height:1.5; }
.mk-repcard__m{ margin-top:10px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }

.mk-breadcrumb {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 20px; font-size: 12.5px; color: var(--mk-primary);
  background: var(--mk-surface); border-bottom: 1px solid var(--mk-border);
}
.mk-breadcrumb a { text-decoration: none; }
.mk-breadcrumb .sep { color: var(--mk-text-faint); }
.mk-breadcrumb .current { font-weight: 600; }

/* ============================================================
   MOLECULE · Sidebar / ATOM · Drawer  (panel lateral + overlay)
   ============================================================ */
.mk-overlay {
  position: fixed; inset: 0; background: rgba(17,24,39,.45);
  opacity: 0; visibility: hidden; transition: .2s; z-index: 50;
}
.mk-overlay.open { opacity: 1; visibility: visible; }
.mk-sidebar {
  position: fixed; top: 0; left: 0; height: 100%; width: 290px; z-index: 60;
  background: var(--mk-surface); transform: translateX(-100%);
  transition: transform .22s ease; display: flex; flex-direction: column;
  box-shadow: var(--mk-shadow-lg);
}
.mk-sidebar.open { transform: none; }
.mk-sidebar__head { padding: 16px 18px; border-bottom: 1px solid var(--mk-border); position: relative; }
.mk-sidebar__name { font-weight: 700; color: var(--mk-primary); }
.mk-sidebar__mail { font-size: 12px; color: var(--mk-text-muted); }
.mk-sidebar__close {
  position: absolute; top: 14px; right: 14px; border: 0; background: none;
  cursor: pointer; color: var(--mk-text-muted); font-size: 18px; line-height: 1;
}
.mk-sidebar__nav { padding: 10px; overflow-y: auto; flex: 1; }
.mk-navitem {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px;
  border-radius: 10px; color: var(--mk-text); cursor: pointer;
  text-decoration: none; margin-bottom: 3px; font-size: 14px;
}
.mk-navitem svg, .mk-navitem .ico { color: var(--mk-primary); width: 18px; height: 18px; flex: none; }
.mk-navitem:hover { background: var(--mk-primary-50); }
.mk-navitem.active { background: var(--mk-primary); color: #fff; }
.mk-navitem.active svg, .mk-navitem.active .ico { color: #fff; }
.mk-sidebar__foot { padding: 16px 18px; border-top: 1px solid var(--mk-border); }
.mk-sidebar__foot a { font-weight: 600; }

/* ============================================================
   Layout de página
   ============================================================ */
.mk-page { padding: 18px 22px 40px; }
.mk-section { /* tarjeta blanca contenedora con borde lavanda */
  background: var(--mk-surface); border: 1px solid var(--mk-border);
  border-radius: var(--mk-radius); box-shadow: var(--mk-shadow); padding: 20px;
}

/* ATOM · HeaderPage */
.mk-headerpage {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 16px;
}
.mk-headerpage h1 { font-size: 22px; font-weight: 800; margin: 0; color: #111; }

/* ATOM · Fieldset / agrupador "Información", "Filtros" */
.mk-fieldset { border: 1px solid var(--mk-border); border-radius: var(--mk-radius); padding: 16px; position: relative; margin-bottom: 16px; }
.mk-fieldset > legend, .mk-fieldset__legend {
  font-size: 12px; color: var(--mk-primary); padding: 0 6px; font-weight: 600;
}

/* ATOM · Grid */
.mk-grid { display: grid; gap: 16px; }
.mk-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.mk-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.mk-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px){ .mk-grid.cols-2,.mk-grid.cols-3,.mk-grid.cols-4{ grid-template-columns: 1fr; } }

/* ============================================================
   ATOM · Button  +  IconButton
   ============================================================ */
.mk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--mk-radius-sm); border: 1px solid transparent;
  font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  background: var(--mk-primary); color: #fff; transition: background .15s, opacity .15s;
}
.mk-btn:hover { background: var(--mk-primary-dark); }
.mk-btn:disabled, .mk-btn.is-disabled { background: var(--mk-primary-50); color: #fff; cursor: not-allowed; }
.mk-btn--secondary { background: var(--mk-slate-btn); }
.mk-btn--secondary:hover { background: #4f5d72; }
.mk-btn--success { background: var(--mk-success); }
.mk-btn--danger-solid { background: var(--mk-danger); }
.mk-btn--danger-solid:hover { background: #b91c1c; }
.mk-btn--excel { background: var(--mk-excel); }
.mk-btn--outline { background: transparent; color: var(--mk-primary); border-color: var(--mk-primary); }
.mk-btn--outline:hover { background: var(--mk-primary-50); }
.mk-btn--ghost { background: transparent; color: var(--mk-text-muted); }
.mk-btn--sm { padding: 6px 11px; font-size: 12.5px; }

.mk-iconbtn {
  display: inline-grid; place-items: center; width: 32px; height: 30px;
  border-radius: var(--mk-radius-sm); border: 1px solid transparent; cursor: pointer;
  background: var(--mk-primary-50); color: var(--mk-primary);
}
.mk-iconbtn:hover { background: var(--mk-primary-100); }
.mk-iconbtn--view  { background: #efe6f7; color: var(--mk-primary); }
.mk-iconbtn--edit  { background: #fde8ef; color: #be185d; }
.mk-iconbtn--delete{ background: #fde7e7; color: var(--mk-danger); }
.mk-iconbtn--dark  { background: var(--mk-slate-btn); color: #fff; }

/* ============================================================
   ATOM · Input / Textarea  +  label
   ============================================================ */
.mk-field { display: flex; flex-direction: column; gap: 6px; }
.mk-label { font-size: 12.5px; font-weight: 600; color: var(--mk-text); }
.mk-label .req { color: var(--mk-danger); margin-left: 2px; }
.mk-input, .mk-textarea, .mk-select {
  width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
  color: var(--mk-text); background: var(--mk-surface);
  border: 1px solid var(--mk-border-2); border-radius: var(--mk-radius-sm); outline: none;
}
.mk-input::placeholder, .mk-textarea::placeholder { color: var(--mk-text-faint); }
.mk-input:focus, .mk-textarea:focus, .mk-select:focus { border-color: var(--mk-primary); box-shadow: 0 0 0 3px var(--mk-primary-50); }
.mk-textarea { min-height: 90px; resize: vertical; }
.mk-input--error { border-color: var(--mk-danger); }
.mk-help { font-size: 11.5px; color: var(--mk-text-muted); }
.mk-help--error { color: var(--mk-danger); }

/* MOLECULE · Combobox (select estilizado + caret) */
.mk-combobox { position: relative; }
.mk-combobox select { appearance: none; -webkit-appearance: none; padding-right: 38px; }
.mk-combobox::after {
  content: ""; position: absolute; right: 14px; top: 50%; width: 8px; height: 8px;
  border-right: 2px solid var(--mk-text-muted); border-bottom: 2px solid var(--mk-text-muted);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}

/* MOLECULE · Datepicker / MonthPicker (input con icono) */
.mk-datepicker { position: relative; }
.mk-datepicker .cal-ico { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--mk-primary); pointer-events: none; }

/* MOLECULE · FileUpload */
.mk-fileupload {
  border: 2px dashed var(--mk-primary-100); border-radius: var(--mk-radius);
  padding: 26px; text-align: center; color: var(--mk-text-muted); background: var(--mk-primary-50);
  cursor: pointer;
}
.mk-fileupload:hover { border-color: var(--mk-primary); }
.mk-fileupload strong { color: var(--mk-primary); }

/* ============================================================
   ATOM · Checkbox / RadioButton / Switch
   ============================================================ */
.mk-check, .mk-radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.mk-check input, .mk-radio input { width: 16px; height: 16px; accent-color: var(--mk-primary); }
.mk-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.mk-switch input { display: none; }
.mk-switch .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .2s; }
.mk-switch .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.mk-switch input:checked + .slider { background: var(--mk-primary); }
.mk-switch input:checked + .slider::before { transform: translateX(18px); }

/* ============================================================
   ATOM · Badge
   ============================================================ */
.mk-badge {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 5px 14px; border-radius: var(--mk-radius-pill);
  font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap;
}
.mk-badge--success { background: var(--mk-success); }
.mk-badge--danger  { background: var(--mk-danger); }
.mk-badge--warning { background: var(--mk-warning); }
.mk-badge--info    { background: var(--mk-info); }
.mk-badge--neutral { background: var(--mk-neutral); }
.mk-badge--dark    { background: #4b5563; }
.mk-badge--wide    { min-width: 130px; }   /* estilo pill ancho de las listas */
.mk-badge--soft.mk-badge--success { background: var(--mk-success-soft); color: var(--mk-success); }
.mk-badge--soft.mk-badge--danger  { background: var(--mk-danger-soft);  color: var(--mk-danger); }
.mk-badge--soft.mk-badge--info    { background: var(--mk-info-soft);    color: #1d4ed8; }

/* ============================================================
   ATOM · Card  /  MOLECULE · LinkCard
   ============================================================ */
.mk-card { background: var(--mk-surface); border: 1px solid var(--mk-border); border-radius: var(--mk-radius); box-shadow: var(--mk-shadow); padding: 18px; }
.mk-linkcard {
  background: var(--mk-surface); border: 1.5px solid var(--mk-primary-100);
  border-radius: var(--mk-radius); padding: 14px 13px 12px; min-height: 100px;
  display: flex; flex-direction: column; cursor: pointer; transition: .15s; text-decoration: none; color: inherit;
}
.mk-linkcard:hover { border-color: var(--mk-primary); box-shadow: var(--mk-shadow); transform: translateY(-1px); }
.mk-linkcard__icon { align-self: center; color: var(--mk-primary-strong); margin: 2px 0 12px; }
.mk-linkcard__title { font-weight: 700; color: #111; font-size: 13.5px; line-height: 1.25; }
.mk-linkcard__sub { font-size: 11.5px; color: var(--mk-text-muted); margin-top: 2px; line-height: 1.3; }
/* El home reparte sus tarjetas en una sola fila cuando caben: una tarjeta
   sola abajo se lee como un error de maquetacion, no como una opcion mas. */
.mk-cardrows { display: grid; grid-template-columns: repeat(60, 1fr); gap: 14px; }
@media (max-width: 900px) { .mk-cardrows > .mk-linkcard { grid-column: span 30 !important; } }
@media (max-width: 560px) { .mk-cardrows > .mk-linkcard { grid-column: span 60 !important; } }
.mk-grid[data-mkcols="5"] { grid-template-columns: repeat(5, 1fr); }
.mk-grid[data-mkcols="6"] { grid-template-columns: repeat(6, 1fr); }
.mk-grid[data-mkcols="5"] .mk-linkcard__icon svg,
.mk-grid[data-mkcols="6"] .mk-linkcard__icon svg { width: 26px; height: 26px; }

/* ATOM · FieldDetail (clave/valor en vistas de detalle) */
.mk-detail { display: flex; flex-direction: column; gap: 3px; padding: 8px 0; }
.mk-detail__label { font-size: 11.5px; color: var(--mk-text-muted); text-transform: uppercase; letter-spacing: .03em; }
.mk-detail__value { font-size: 14px; color: var(--mk-text); font-weight: 600; }

/* ============================================================
   ATOM · Table  /  MOLECULE · DataTable
   ============================================================ */
.mk-tablewrap { width: 100%; overflow-x: auto; border-radius: var(--mk-radius); }
.mk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.mk-table thead th {
  background: var(--mk-primary); color: #fff; text-align: left; font-weight: 600;
  padding: 12px 14px; white-space: nowrap; font-size: 12.5px;
}
.mk-table thead th:first-child { border-top-left-radius: 6px; }
.mk-table thead th:last-child  { border-top-right-radius: 6px; }
.mk-table tbody td { padding: 11px 14px; border-bottom: 1px solid var(--mk-border-2); color: var(--mk-text); }
.mk-table tbody tr:hover { background: var(--mk-primary-50); }
.mk-table .actions { display: flex; gap: 6px; }
.mk-datatable__toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.mk-search { display: flex; align-items: center; gap: 8px; }
.mk-search .mk-input { min-width: 230px; }
.mk-export { display: flex; gap: 8px; }
.mk-datatable__foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.mk-rowinfo { font-size: 12.5px; color: var(--mk-text-muted); }
.mk-empty { text-align: center; color: var(--mk-text-muted); padding: 26px; }

/* MOLECULE · Pagination */
.mk-pagination { display: flex; align-items: center; gap: 6px; }
.mk-pagination button {
  min-width: 30px; height: 30px; padding: 0 8px; border-radius: var(--mk-radius-sm);
  border: 1px solid var(--mk-primary-100); background: var(--mk-surface);
  color: var(--mk-primary); cursor: pointer; font-size: 13px; font-family: inherit;
}
.mk-pagination button:hover { background: var(--mk-primary-50); }
.mk-pagination button.active { background: var(--mk-primary); color: #fff; border-color: var(--mk-primary); }
.mk-pagination .pginfo, .mk-pagination__info { font-size: 12.5px; color: var(--mk-text-muted); margin-right: 6px; }

/* ============================================================
   ATOM · Tabs  +  MOLECULE · Steps  +  ATOM · Accordion
   ============================================================ */
.mk-tabs { display: flex; border: 1px solid var(--mk-border-2); border-radius: var(--mk-radius-sm); overflow: hidden; }
.mk-tab { flex: 1; text-align: center; padding: 11px 14px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--mk-text-muted); background: #f7f5fa; border: 0; font-family: inherit; }
.mk-tab.active { background: var(--mk-primary); color: #fff; }
.mk-tabpanel { padding: 16px 2px; }
.mk-tabpanel[hidden] { display: none; }
.mk-fileupload.is-over{ border-color:var(--mk-primary); background:#F6F0FA; }

.mk-steps { display: flex; flex-direction: column; gap: 14px; }
.mk-step { border: 1px solid var(--mk-border); border-radius: var(--mk-radius); padding: 16px 18px; background: var(--mk-surface); }
.mk-step__head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.mk-step__num { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: #e5e7eb; color: var(--mk-text-muted); }
.mk-step.active .mk-step__num, .mk-step.done .mk-step__num { background: var(--mk-primary); color: #fff; }
.mk-step__title { font-weight: 700; color: var(--mk-primary); }
.mk-step.collapsed .mk-step__title { color: var(--mk-text); }
.mk-step__desc { font-size: 12px; color: var(--mk-text-muted); }
.mk-step__chev { margin-left: auto; color: var(--mk-text-muted); transition: transform .2s; }
.mk-step.collapsed .mk-step__body { display: none; }
.mk-step.collapsed .mk-step__chev { transform: rotate(-90deg); }
.mk-step__body { padding-top: 16px; }
.mk-step__actions { display: flex; justify-content: flex-end; margin-top: 16px; }

.mk-accordion { border: 1px solid var(--mk-border); border-radius: var(--mk-radius); overflow: hidden; }
.mk-accordion__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; font-weight: 600; background: var(--mk-surface); }
.mk-accordion__chev { color: var(--mk-text-muted); transition: transform .2s; }
.mk-accordion.collapsed .mk-accordion__chev { transform: rotate(-90deg); }
.mk-accordion.collapsed .mk-accordion__body { display: none; }
.mk-accordion__body { padding: 16px; border-top: 1px solid var(--mk-border); }

/* ============================================================
   ATOM · Alert + Sonner → ver "BANDAS DE ESTADO" más abajo
   (definición unificada con 4 colores, ícono y cierre)
   ============================================================ */

/* ============================================================
   ATOM · Modal  +  Popover  +  Tooltip
   ============================================================ */
.mk-modal-overlay { position: fixed; inset: 0; background: rgba(17,24,39,.5); display: none; place-items: center; z-index: 70; padding: 20px; }
.mk-modal-overlay.open { display: grid; }
/* La ventana de revisión se abre encima del formulario que la invoca */
#modal-revisar { z-index: 80; }
.mk-modal { background: #fff; border-radius: var(--mk-radius); width: min(560px, 100%); box-shadow: var(--mk-shadow-lg); overflow: hidden; }
.mk-modal--lg { width: min(1240px, 100%); }
.mk-modal--form { width: min(1240px, 100%); }
.mk-modal__head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--mk-border); font-weight: 700; }
.mk-modal__body { padding: 20px; overflow-y: auto; max-height: calc(85vh - 130px); }
.mk-modal { max-height: 90vh; display: flex; flex-direction: column; }
.mk-modal__head, .mk-modal__foot { flex: none; }
.mk-modal__foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--mk-border); }
.mk-drawer { /* ATOM Drawer: panel lateral deslizante (Centro de Notificaciones) */ }

/* MOLECULE · Combobox multiselección (Select All / uno / varios) */
.mk-multiselect{ position:relative; }
.mk-msbtn{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 12px; border:1px solid var(--mk-border-2); border-radius:var(--mk-radius-sm);
  background:#fff; font:inherit; font-size:13.5px; color:var(--mk-text); cursor:pointer; text-align:left; }
.mk-msbtn:hover{ border-color:var(--mk-primary-200); }
.mk-multiselect.open .mk-msbtn{ border-color:var(--mk-primary); box-shadow:0 0 0 3px rgba(106,27,154,.10); }
.mk-multiselect.open .mk-msbtn svg{ transform:rotate(180deg); }
.mk-mspanel{ display:none; position:absolute; z-index:60; left:0; right:0; top:calc(100% + 4px);
  background:#fff; border:1px solid var(--mk-primary-100); border-radius:var(--mk-radius-sm);
  box-shadow:var(--mk-shadow-lg); padding:6px; max-height:260px; overflow:auto; }
.mk-multiselect.open .mk-mspanel{ display:block; }
.mk-msopt{ display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border-radius:6px; cursor:pointer; }
.mk-msopt:hover{ background:var(--mk-primary-50); }
.mk-msopt input{ margin-top:2px; width:16px; height:16px; accent-color:var(--mk-primary); flex:none; }
.mk-msopt__n{ display:block; font-weight:600; font-size:13px; color:#111; }
.mk-msopt__m{ display:block; font-size:11.5px; color:var(--mk-text-muted); }
.mk-msopt--all .mk-msopt__n{ color:var(--mk-primary); }
.mk-msdiv{ height:1px; background:var(--mk-border); margin:4px 8px; }
/* Selector de país de la barra superior */
.mk-country{ margin-left:auto; display:inline-flex; align-items:center; gap:8px; }
.mk-country__lb{ font-size:12px; color:var(--mk-primary); font-weight:700; }
.mk-country select{ font:inherit; font-size:12.5px; color:var(--mk-primary); background:var(--mk-primary-50);
  border:1px solid var(--mk-primary-200); border-radius:999px; padding:5px 12px; cursor:pointer; }
.mk-country select:disabled{ cursor:not-allowed; opacity:1; border-style:dashed; }
.mk-country .mk-tooltip__bubble{ bottom:auto; top:calc(100% + 8px); left:auto; right:0; transform:none;
  white-space:normal; width:320px; text-align:left; line-height:1.45; padding:9px 12px; }
.mk-navbar{ overflow:visible; }
.mk-country:hover .mk-tooltip__bubble{ visibility:visible; }
.mk-pbi{ display:none; }
body.mk-pbi-on .mk-pbi{ display:block; }
.mk-demo{ display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--mk-text-muted); }
.mk-popover { position: absolute; background: #fff; border: 1px solid var(--mk-border); border-radius: var(--mk-radius-sm); box-shadow: var(--mk-shadow-lg); padding: 10px 12px; z-index: 65; }
.mk-tooltip { position: relative; }
.mk-tooltip__bubble { visibility: hidden; position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; font-size: 11.5px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; z-index: 65; }
.mk-tooltip:hover .mk-tooltip__bubble { visibility: visible; }

/* ============================================================
   ATOM · Loading / Skeleton / Progress / Calendar / NotFound
   ============================================================ */
.mk-loading { display: grid; place-items: center; padding: 70px 0; }
.mk-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--mk-primary-100); border-top-color: var(--mk-primary); animation: mk-spin .8s linear infinite; }
@keyframes mk-spin { to { transform: rotate(360deg); } }
.mk-skeleton { background: linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%); background-size: 400% 100%; animation: mk-shimmer 1.3s infinite; border-radius: 6px; height: 14px; }
@keyframes mk-shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
.mk-progress { height: 8px; background: var(--mk-primary-100); border-radius: 999px; overflow: hidden; }
.mk-progress__bar { height: 100%; background: var(--mk-primary); border-radius: 999px; }
.mk-notfound { text-align: center; padding: 70px 20px; color: var(--mk-text-muted); }
.mk-notfound h2 { color: var(--mk-primary); font-size: 64px; margin: 0; }

.mk-calendar { width: 280px; border: 1px solid var(--mk-border); border-radius: var(--mk-radius); padding: 12px; background: #fff; }
.mk-calendar__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
.mk-calendar__grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; text-align: center; font-size: 12.5px; }
.mk-calendar__grid .dow { color: var(--mk-text-muted); font-weight: 600; padding: 4px 0; }
.mk-calendar__grid .day { padding: 6px 0; border-radius: 6px; cursor: pointer; }
.mk-calendar__grid .day:hover { background: var(--mk-primary-50); }
.mk-calendar__grid .day.sel { background: var(--mk-primary); color: #fff; }

/* ============================================================
   CONTROLES DEL PROTOTIPO · Bandas de anotación
   Documentan SIEMPRE los controles de cada pantalla.
   Verde   = controles/validaciones que la pantalla GARANTIZA
             (campos obligatorios, formatos, reglas de negocio OK).
   Naranja = alertas / restricciones / advertencias que el
             usuario debe conocer (condiciones especiales, bloqueos).
   ============================================================ */
.mk-controls { border: 1px dashed var(--mk-primary-100); border-radius: var(--mk-radius); padding: 14px 16px; margin-bottom: 16px; background: #fdfcff; }
.mk-controls__title { font-size: 12px; font-weight: 700; color: var(--mk-primary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.mk-band { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; border-left: 4px solid; margin: 8px 0; }
.mk-band:last-child { margin-bottom: 0; }
.mk-band__tag { flex: none; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; color: #fff; line-height: 1.4; }
.mk-band__title { font-weight: 700; display: block; }
.mk-band--green  { background: #ECFDF3; border-left-color: #15803D; color: #14532D; }
.mk-band--green  .mk-band__tag { background: #15803D; }
.mk-band--orange { background: #FFF7ED; border-left-color: #EA8A1E; color: #7C3A06; }
.mk-band--orange .mk-band__tag { background: #EA8A1E; }
/* Rojo = la Plataforma BLOQUEA. Verde = en regla. Naranja = revisa, pero
   puedes guardar borrador. Los tres estados se usan con ese significado
   en todo el dominio y no se mezclan. */
.mk-band--red    { background: #FEF2F2; border-left-color: #B42318; color: #7A271A; }
.mk-band--red    .mk-band__tag { background: #B42318; }


/* Info-icon que dispara un Tooltip (protección de UX en campos/acciones) */
.mk-info {
  display: inline-grid; place-items: center; width: 16px; height: 16px;
  border-radius: 50%; background: var(--mk-primary-50); color: var(--mk-primary);
  font-size: 11px; font-weight: 700; cursor: help; margin-left: 5px; vertical-align: middle;
}

/* ============================================================
   ROUTING DEL PROTOTIPO · Vistas + transiciones
   Un solo HTML contiene varias <section class="mk-view">.
   Solo una está activa; al navegar se hace fade/slide.
   ============================================================ */
.mk-view { display: none; }
.mk-view.active { display: block; animation: mk-view-in .28s cubic-bezier(.22,.61,.36,1); }
@keyframes mk-view-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.mk-breadcrumb .crumb { cursor: pointer; }
.mk-breadcrumb .crumb:hover { text-decoration: underline; }

/* ============================================================
   BANDAS DE ESTADO (feedback) · 4 colores + ícono + cierre
   Comunican QUÉ está pasando. No depender solo del color:
   siempre ícono + texto. Colocar cerca de la acción.
   - verde  = éxito (operación OK, autocierra, cierre manual)
   - naranja= advertencia (algo a considerar, no error)
   - rojo   = error (impide continuar: qué pasó y qué hacer)
   - azul   = informativo (contexto neutro)
   ============================================================ */
.mk-alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--mk-radius-sm); font-size: 13px; border: 1px solid; }
.mk-alert__icon { flex: none; margin-top: 1px; }
.mk-alert__body { flex: 1; }
.mk-alert__body strong { display: block; }
.mk-alert__close { flex: none; background: none; border: 0; cursor: pointer; color: inherit; opacity: .6; font-size: 16px; line-height: 1; }
.mk-alert__close:hover { opacity: 1; }
.mk-alert--info    { background: var(--mk-info-soft);    border-color: #bfdbfe; color: #1e40af; }
.mk-alert--success { background: var(--mk-success-soft); border-color: #bbf7d0; color: #166534; }
.mk-alert--warning { background: var(--mk-warning-soft); border-color: #fde68a; color: #92400e; }
.mk-alert--danger  { background: var(--mk-danger-soft);  border-color: #fecaca; color: #991b1b; }

/* Sonner / toasts: mismas 4 semánticas, flotantes, autocierre */
.mk-sonner { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: flex; flex-direction: column; gap: 10px; }
.mk-toast { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 1px solid var(--mk-border); border-left: 4px solid var(--mk-primary); border-radius: var(--mk-radius-sm); box-shadow: var(--mk-shadow-lg); padding: 12px 14px; min-width: 260px; max-width: 360px; font-size: 13px; animation: mk-view-in .25s ease; }
.mk-toast__close { background: none; border: 0; cursor: pointer; opacity: .5; font-size: 15px; line-height: 1; }
.mk-toast__close:hover { opacity: 1; }
.mk-toast--success { border-left-color: var(--mk-success); }
.mk-toast--warning { border-left-color: var(--mk-warning); }
.mk-toast--danger  { border-left-color: var(--mk-danger); }
.mk-toast--info    { border-left-color: var(--mk-info); }

/* ============================================================
   Botón con estado de carga (feedback inmediato)
   ============================================================ */
.mk-btn.is-loading { position: relative; color: transparent !important; pointer-events: none; }
.mk-btn.is-loading::after { content: ""; position: absolute; width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; animation: mk-spin .7s linear infinite; }

/* ============================================================
   Selección masiva (tablas): barra contextual con contador
   ============================================================ */
.mk-bulkbar { display: none; align-items: center; justify-content: space-between; gap: 12px; background: var(--mk-primary-50); border: 1px solid var(--mk-primary-100); border-radius: var(--mk-radius-sm); padding: 10px 14px; margin-bottom: 12px; }
.mk-bulkbar.show { display: flex; }
.mk-bulkbar__count { font-weight: 700; color: var(--mk-primary); }
.mk-bulkbar__actions { display: flex; gap: 8px; }

/* Estado vacío con acción */
.mk-empty { text-align: center; color: var(--mk-text-muted); padding: 30px 20px; }
.mk-empty__title { font-weight: 600; color: var(--mk-text); margin-bottom: 6px; }

/* ============================================================
   Accesibilidad: foco visible por teclado
   ============================================================ */
:focus-visible { outline: 2px solid var(--mk-primary); outline-offset: 2px; border-radius: 4px; }

/* utilidades mínimas */
.mk-row { display: flex; gap: 12px; align-items: center; }
.mk-spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.mk-mt { margin-top: 16px; } .mk-mb { margin-bottom: 16px; }
.mk-right { display: flex; justify-content: flex-end; }


/* ============================================================
   MODO OFERTA
   El prototipo se presenta al cliente sin las secciones
   explicativas ni las tarjetas de Controles: son material de
   trabajo del equipo, no parte de la Plataforma. El marcado se
   conserva intacto; para volver a mostrarlas basta con quitar
   estas tres reglas.
   ============================================================ */
.mk-solodev { display: none !important; }
.mk-controls { display: none !important; }
/* Bandas de documentacion (Control / Alerta) dentro de las pantallas:
   no son parte de la Plataforma. Las bandas de resultado que la
   Plataforma emite al guardar, editar o inactivar SI se muestran. */
/* Banda neutra: se usa cuando la pantalla no tiene todavia nada que decir
   -por ejemplo, un cierre sin fondos en el alcance-. Naranja ahi mentiria. */
/* Grupo de comprobaciones de un fondo dentro de una fase del cierre. */
.mk-fondogrp{ border:1px solid var(--mk-primary-100); border-radius:var(--mk-radius-sm);
  padding:10px 12px 12px; margin:0 0 12px; background:#fdfcff; }
.mk-fondogrp__h{ font-weight:700; color:#3b1152; font-size:13px; margin:0 0 8px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
/* Sello de alcance: dice de que fondos habla el bloque que lo lleva. */
.mk-alcance{ display:inline-flex; align-items:center; gap:8px; margin:0 0 10px;
  background:var(--mk-primary-50); border:1px solid var(--mk-primary-100);
  border-radius:999px; padding:3px 12px 3px 10px; font-size:12px; }
.mk-alcance__lb{ color:var(--mk-primary); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:10.5px; }
.mk-alcance__v{ color:#333; font-weight:600; }
.mk-band--neutra { background:#f4f2f7; border-left:3px solid #b9b0c6; color:var(--mk-text-muted); }
.mk-band--neutra .mk-band__title { color:#3b1152; }
.mk-band--doc { display: none !important; }
.mk-lead     { display: none !important; }
.mk-explica  { display: none !important; }
/* Campos prellenados desde el Cotizador / Evidencia de Mejor Ejecución */
.mk-prefill, input.mk-prefill, select.mk-prefill, .mk-prefill .mk-select{
  background:#F4ECF8 !important; box-shadow: inset 0 0 0 1.5px #C9A7E4; border-radius:8px;
}
.mk-field.mk-prefill{ background:#F7F0FB !important; box-shadow:none; border-radius:10px; padding:6px 8px; }
.mk-field.mk-prefill > .mk-label{ background:transparent; }

/* ============================================================
   COTIZADOR HORIZONTAL
   Los datos que digita el usuario quedan fijos a la izquierda y
   el resultado se pinta a la derecha: no hay que subir y bajar
   para volver a ver lo que se digito.
   ============================================================ */
.ct-wrap{ display:grid; grid-template-columns:300px minmax(0,1fr); gap:20px; align-items:start; }
.ct-left{ position:sticky; top:0; background:#FBF7FE; border:1px solid var(--mk-primary-100);
  border-radius:var(--mk-radius); padding:14px; }
.ct-left__t{ font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  color:var(--mk-primary); margin-bottom:10px; }
.ct-left .mk-formgrid{ grid-template-columns:1fr; gap:12px; }
.ct-right{ min-width:0; }
.ct-right .mk-fieldset{ margin-top:0; }
.mk-tabmerge > * + *{ margin-top:20px; }
.ct-flujo{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin-top:10px;
  border:1px solid var(--mk-border); border-radius:10px; padding:12px 14px; background:var(--mk-bg); }
.ct-flujo__c{ min-width:0; }
.ct-flujo__l{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--mk-primary); margin-bottom:3px; }
.ct-flujo__v{ font-size:13px; font-weight:600; color:var(--mk-text); line-height:1.4; }
.ct-flujo__d{ display:block; font-size:11.5px; font-weight:400; color:var(--mk-text-muted); }
.ct-flujo__x{ font-size:18px; color:var(--mk-text-muted); }
@media(max-width:720px){ .ct-flujo{ grid-template-columns:1fr; } .ct-flujo__x{ display:none; } }
.ct-facts{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.ct-facts .mk-detail{ margin:0; }
/* Cuadro compacto del valor indicativo: cuatro celdas, sin parrafos */
.ct-cell{ background:#FBF7FE; border:1px solid var(--mk-primary-100); border-radius:8px; padding:9px 11px; min-width:0; }
.ct-cell__l{ font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mk-primary-dark); margin-bottom:3px; display:flex; align-items:center; gap:5px; }
.ct-cell__v{ font-size:15px; font-weight:800; color:#111; font-variant-numeric:tabular-nums; line-height:1.3;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* Un importe largo -COP 4.231.683.465- encoge antes que partirse en dos renglones */
.ct-cell__v--largo{ font-size:13px; letter-spacing:-.2px; }
.ct-cell__d{ font-size:11px; color:var(--mk-text-muted); margin-top:2px; line-height:1.35; }
@media (max-width:900px){ .ct-facts{ grid-template-columns:1fr 1fr; } }
.ct-right .mk-tablewrap{ overflow-x:auto; }

/* ============================================================
   TABLAS ANCHAS
   Antes las columnas se comprimian y el texto se apilaba en 5 o 6
   lineas: la fila crecia y obligaba a scroll vertical. Ahora la
   tabla conserva un ancho minimo legible y, si no cabe, se
   desplaza en horizontal dentro de su contenedor.
   ============================================================ */
.mk-tablewrap .mk-table td .mk-help{
  display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:300px; }
.ct-right .mk-table td .mk-btn{ white-space:nowrap; }
@media (max-width:1000px){ .ct-wrap{ grid-template-columns:1fr; } .ct-left{ position:static; } }


.mk-navgroup{ font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--mk-text-muted); padding:14px 12px 6px; }
.mk-accordion__head{ display:flex; align-items:center; gap:12px; }
.mk-accordion__ico{ color:var(--mk-primary-strong); display:flex; }
.mk-accordion__t{ display:block; font-weight:700; color:#111; }
.mk-accordion__d{ display:block; font-size:12.5px; font-weight:400; color:var(--mk-text-muted); margin-top:2px; }
.mk-accordion__head > .mk-accordion__chev{ margin-left:auto; }
.mk-accordion{ margin-bottom:16px; }
.mk-linkcard--hot{ border-color:var(--mk-primary); box-shadow:0 0 0 3px rgba(106,27,154,.10); }
.mk-cardwrap{ position:relative; display:flex; }
.mk-cardwrap > .mk-linkcard{ flex:1; }
.mk-cardwrap__info{ position:absolute; top:10px; right:10px; z-index:60; }
.nt-cal{ display:flex; flex-wrap:wrap; gap:6px; }
.nt-cal label{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--mk-border,#E3DDEB); border-radius:14px; padding:4px 10px; font-size:12px; cursor:pointer; background:#fff; }
.nt-cal label.on{ border-color:#6A1B9A; background:#F4ECF8; color:#4A1270; font-weight:600; }
.nt-cal label.off{ opacity:.5; cursor:not-allowed; }
.mk-tooltip__bubble--tc{ width:340px; }
.mk-tooltip__bubble--wide{ white-space:normal; width:260px; line-height:1.45; text-align:left;
  padding:9px 11px; font-weight:400; }
.mk-lead{ font-size:13.5px; color:#3f3f46; line-height:1.6; background:#FBF7FE;
  border-left:4px solid var(--mk-primary); border-radius:8px; padding:12px 16px; }
.mk-country{ margin-left:auto; position:relative; display:inline-flex; align-items:center; }
.mk-country select{
  appearance:none; -webkit-appearance:none; -moz-appearance:none;
  font:inherit; font-size:12.5px; color:#111; cursor:pointer;
  padding:5px 30px 5px 14px; border:1px solid var(--mk-primary); border-radius:999px;
  background:#fff; line-height:1.4; }
.mk-country select:hover{ background:var(--mk-primary-50); }
.mk-country select:focus{ outline:none; box-shadow:0 0 0 3px rgba(106,27,154,.12); }
.mk-country__chev{ position:absolute; right:11px; pointer-events:none; color:var(--mk-primary); display:flex; }
.mk-country__pill{ margin-left:auto; display:inline-flex; align-items:center; gap:7px;
  font:inherit; font-size:12.5px; color:var(--mk-primary); cursor:pointer;
  padding:5px 14px; border:1px dashed var(--mk-primary-200); border-radius:999px;
  background:var(--mk-primary-50); line-height:1.4; }
.mk-country__pill:hover{ background:var(--mk-primary-100); }
.mk-paisbox{ border:1px solid var(--mk-primary); border-radius:var(--mk-radius);
  padding:16px 18px; background:#FBF7FE; margin-bottom:18px; }
.mk-paisbox__t{ font-weight:800; color:var(--mk-primary); font-size:13px;
  text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }

/* ============================================================
   MOLECULE · Centro de Notificaciones (campana + panel lateral)
   ============================================================ */
.mk-bell{ margin-left:auto; position:relative; display:grid; place-items:center;
  width:38px; height:34px; border:1px solid var(--mk-primary-100); border-radius:var(--mk-radius-sm);
  background:var(--mk-surface); color:var(--mk-primary); cursor:pointer; }
.mk-bell:hover{ background:var(--mk-primary-50); }
.mk-bell__dot{ position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px;
  border-radius:999px; background:var(--mk-danger); color:#fff; font-size:10.5px; font-weight:800;
  display:grid; place-items:center; border:2px solid #fff; }
.mk-country{ margin-left:12px; }

.mk-notif{ position:fixed; top:0; right:0; height:100%; width:430px; max-width:92vw; z-index:60;
  background:var(--mk-surface); transform:translateX(100%); transition:transform .22s ease;
  display:flex; flex-direction:column; box-shadow:var(--mk-shadow-lg); }
.mk-notif.open{ transform:none; visibility:visible; }
/* El panel cerrado no debe generar barra horizontal ni aparecer en capturas */
.mk-notif{ visibility:hidden; }
html,body{ overflow-x:hidden; }
.mk-notif__head{ padding:18px 20px 14px; border-bottom:1px solid var(--mk-border); position:relative; }
.mk-notif__head h2{ margin:0; font-size:21px; font-weight:800; color:#111; }
.mk-notif__mail{ font-size:12.5px; color:var(--mk-text-muted); }
.mk-notif__close{ position:absolute; top:18px; right:18px; border:0; background:none; cursor:pointer;
  color:var(--mk-text-muted); font-size:20px; line-height:1; }
.mk-notif__filtros{ padding:16px 20px; background:#FBF7FE; border-bottom:1px solid var(--mk-border);
  display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.mk-notif__filtros .mk-btn{ grid-column:1 / -1; }
.mk-notif__list{ padding:16px 20px; overflow-y:auto; flex:1; background:#FDFAFF; }
.mk-notif__foot{ padding:12px 20px; border-top:1px solid var(--mk-border); font-size:12px;
  color:var(--mk-success); text-align:center; }

.mk-ncard{ background:var(--mk-surface); border:1px solid var(--mk-primary-100);
  border-radius:var(--mk-radius); padding:14px 16px; margin-bottom:14px; position:relative; }
.mk-ncard.unread{ background:#FBF7FE; }
.mk-ncard__top{ display:flex; gap:12px; align-items:flex-start; }
.mk-ncard__ico{ flex:none; display:grid; place-items:center; width:26px; height:26px; border-radius:50%; }
.mk-ncard__ico--ok{ background:var(--mk-success-soft); color:var(--mk-success); }
.mk-ncard__ico--info{ background:var(--mk-info-soft); color:var(--mk-info); }
.mk-ncard__ico--warn{ background:var(--mk-warning-soft); color:var(--mk-warning); }
.mk-ncard__ico--err{ background:var(--mk-danger-soft); color:var(--mk-danger); }
.mk-ncard__t{ font-weight:700; color:#111; font-size:14px; }
.mk-ncard__d{ font-size:12.5px; color:var(--mk-text-muted); margin-top:3px; line-height:1.5; }
.mk-ncard__meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px;
  font-size:11.5px; color:var(--mk-text-muted); }
.mk-ncard__tag{ border:1px solid var(--mk-primary-200); color:var(--mk-primary); border-radius:999px;
  padding:2px 10px; font-size:11px; font-weight:600; }
.mk-ncard__unread{ position:absolute; top:16px; right:16px; width:8px; height:8px; border-radius:50%;
  background:var(--mk-primary); }
.mk-ncard__badges{ margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }

/* ============================================================
   MODULO - Setup / Base Operativa / Templates
   ============================================================ */
.mk-tplhead{ display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:#fff; border:1px solid var(--mk-border); border-radius:var(--mk-radius);
  padding:12px 16px; box-shadow:var(--mk-shadow); margin-bottom:16px; flex-wrap:wrap; }
.mk-tplhead__left{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--mk-text); }
.mk-tplhead__left svg{ color:var(--mk-primary-strong); flex:none; }

.mk-tplfilters{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.mk-tplfilters .mk-field{ min-width:190px; }
.mk-tplfilters .mk-field--search{ flex:1; min-width:240px; }

.mk-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:18px; }
@media (max-width:900px){ .mk-kpis{ grid-template-columns:repeat(2,1fr); } }
.mk-kpi{ border:1px solid var(--mk-border); border-radius:var(--mk-radius); padding:12px 14px; background:#fff; }
.mk-kpi__l{ font-size:11.5px; color:var(--mk-text-muted); text-transform:uppercase; letter-spacing:.03em; }
.mk-kpi__v{ font-size:20px; font-weight:800; color:#111; margin-top:2px; }
.mk-kpi--p{ background:#FBF7FE; }
.mk-kpi--b{ background:#F5F8FF; }
.mk-kpi--g{ background:#F4FBF6; }
.mk-kpi--y{ background:#FFF8EE; }
.mk-kpi--r{ background:#FEF3F2; }

.mk-tplcard{ background:#fff; border:1px solid var(--mk-border); border-radius:var(--mk-radius);
  box-shadow:var(--mk-shadow); margin-bottom:16px; overflow:hidden; transition:box-shadow .18s, border-color .18s; }
.mk-tplcard:hover{ border-color:var(--mk-primary-200); box-shadow:0 6px 20px rgba(106,27,154,.10); }
.mk-tplcard.is-off{ opacity:.72; }
.mk-tplcard__top{ display:flex; align-items:flex-start; gap:14px; padding:16px 18px; flex-wrap:wrap; }
.mk-tplcard__ico{ width:42px; height:42px; flex:none; border-radius:10px; display:grid; place-items:center;
  background:var(--mk-primary-50); color:var(--mk-primary-strong); }
.mk-tplcard__id{ flex:1; min-width:260px; }
.mk-tplcard__title{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.mk-tplcard__title h3{ margin:0; font-size:15.5px; font-weight:800; color:#111; }
.mk-tplcard__meta{ font-size:12.5px; color:var(--mk-text-muted); margin-top:3px; }
.mk-tplcard__meta b{ color:var(--mk-text); font-weight:600; }
.mk-tplcard__meta .mk-dot{ color:var(--mk-border-2); margin:0 7px; }
.mk-tplcard__trace{ font-size:12px; color:var(--mk-text-faint); margin-top:2px; }
.mk-tplcard__trace u{ text-decoration:none; color:var(--mk-primary); }
.mk-tplcard__desc{ padding:0 18px 12px; font-size:12.5px; color:var(--mk-text-muted);
  border-top:1px solid var(--mk-border-2); padding-top:12px; margin:0 0 0 0; }
.mk-tplcard__actions{ display:flex; gap:8px; flex:none; }

.mk-actbtn{ display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  min-width:58px; padding:8px 6px; border:1.5px solid var(--mk-primary); border-radius:9px;
  background:#fff; color:var(--mk-primary); font-family:inherit; font-size:11.5px; font-weight:600;
  cursor:pointer; transition:background .15s, transform .12s; }
.mk-actbtn:hover{ background:var(--mk-primary-50); transform:translateY(-1px); }
.mk-actbtn--danger{ border-color:var(--mk-danger); color:var(--mk-danger); }
.mk-actbtn--danger:hover{ background:var(--mk-danger-soft); }
.mk-actbtn--success{ border-color:var(--mk-success); color:var(--mk-success); }
.mk-actbtn--success:hover{ background:var(--mk-success-soft); }

.mk-tplmetrics{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:0 18px 18px; }
@media (max-width:900px){ .mk-tplmetrics{ grid-template-columns:1fr; } }
.mk-metric{ border-radius:8px; padding:10px 14px; }
.mk-metric__l{ font-size:11.5px; font-weight:600; }
.mk-metric__v{ font-size:16px; font-weight:800; color:#111; margin-top:1px; }
.mk-metric--p{ background:#F8F2FC; } .mk-metric--p .mk-metric__l{ color:var(--mk-primary); }
.mk-metric--b{ background:#EFF6FF; } .mk-metric--b .mk-metric__l{ color:var(--mk-info); }
.mk-metric--g{ background:#F0FDF4; } .mk-metric--g .mk-metric__l{ color:var(--mk-success); }

.mk-badge--tag{ background:var(--mk-primary); }
.mk-badge--outline{ background:#EFF6FF; color:var(--mk-info); }
.mk-badge--outline-g{ background:#F1F5F9; color:#475569; }

.mk-modal--form{ width:min(620px,100%); }
.mk-modal__head--brand{ border-bottom:0; padding-bottom:4px; }
.mk-modal__head--brand span{ color:var(--mk-primary); font-size:16.5px; font-weight:800; }
.mk-modal--form{ border-top:4px solid var(--mk-primary); }
.mk-formgrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:640px){ .mk-formgrid{ grid-template-columns:1fr; } }
.mk-formgrid .span2{ grid-column:1 / -1; }
/* Formularios de captura anchos: tres columnas. A dos, un campo ocupa media
   pantalla y la lectura se vuelve un zigzag. */
#ntFsContexto .mk-formgrid, #ntSwapBox .mk-formgrid{ grid-template-columns:repeat(3,1fr); }
@media (max-width:1100px){ #ntFsContexto .mk-formgrid, #ntSwapBox .mk-formgrid{ grid-template-columns:1fr 1fr; } }
@media (max-width:700px){ #ntFsContexto .mk-formgrid, #ntSwapBox .mk-formgrid{ grid-template-columns:1fr; } }

/* --- Contrapartes Habilitadas --- */
.mk-metrics4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:0 18px 18px; }
@media (max-width:1100px){ .mk-metrics4{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px){ .mk-metrics4{ grid-template-columns:1fr; } }
.mk-metric--o{ background:#FFF7ED; } .mk-metric--o .mk-metric__l{ color:#C2650B; }
.mk-tplcard__ico--cp{ background:#EFF6FF; color:var(--mk-info); }
.mk-badge--banco{ background:#3981F6; }
.mk-badge--camara{ background:#15803D; }
.mk-badge--broker{ background:#E8A317; }
.mk-badge--corp{ background:#F1F5F9; color:#475569; }
.mk-badge--rating{ background:#F1F5F9; color:#334155; font-weight:800; letter-spacing:.02em; }
.mk-util{ height:5px; border-radius:999px; background:#F1E7DA; margin-top:7px; overflow:hidden; }
.mk-util__b{ height:100%; border-radius:999px; background:#EA8A1E; }
.mk-util__b.hi{ background:var(--mk-danger); }

/* --- Subyacentes --- */
.mk-tplcard__ico--fx{ background:#F3EDFC; color:var(--mk-primary-strong); }
.mk-tplcard__ico--tasa{ background:#F3EDFC; color:var(--mk-success); }
.mk-badge--divisa{ background:#3981F6; }
.mk-badge--tasa{ background:#15803D; }
.mk-badge--indice{ background:#7C3AED; }
.mk-badge--clase{ background:#F1F5F9; color:#475569; }
.mk-inline{ display:flex; gap:26px; flex-wrap:wrap; font-size:12.5px; color:var(--mk-text-muted); padding:0 18px 16px; }
.mk-inline b{ color:#111; font-weight:700; }
.mk-inline .v-p{ color:var(--mk-primary); font-weight:800; }
.mk-inline .v-b{ color:var(--mk-info); font-weight:800; }
.mk-inline .v-g{ color:var(--mk-success); font-weight:800; }

/* --- Alcance de aplicacion (fondos) --- */
.mk-scope{ border:1px solid var(--mk-border); border-radius:var(--mk-radius); background:#FDFCFF; padding:14px 16px; margin-top:18px; }
.mk-scope__t{ font-size:12px; font-weight:800; color:var(--mk-primary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
.mk-scope__q{ font-size:13px; color:var(--mk-text); margin-bottom:12px; }
.mk-scope__opt{ display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border:1px solid var(--mk-border-2);
  border-radius:8px; background:#fff; cursor:pointer; margin-bottom:8px; transition:border-color .15s, background .15s; }
.mk-scope__opt:hover{ border-color:var(--mk-primary-200); }
.mk-scope__opt.sel{ border-color:var(--mk-primary); background:var(--mk-primary-50); }
.mk-scope__opt input{ margin-top:2px; accent-color:var(--mk-primary); width:16px; height:16px; flex:none; }
.mk-scope__lb{ font-weight:700; font-size:13px; color:#111; display:block; }
.mk-scope__d{ font-size:12px; color:var(--mk-text-muted); }
.mk-scope__slot{ margin:2px 0 10px 27px; }
.mk-fundlist{ border:1px solid var(--mk-border-2); border-radius:8px; max-height:190px; overflow-y:auto; background:#fff; }
.mk-fund{ display:flex; gap:10px; align-items:center; padding:9px 12px; border-bottom:1px solid #F1F0F5; cursor:pointer; }
.mk-fund:last-child{ border-bottom:0; }
.mk-fund:hover{ background:var(--mk-primary-50); }
.mk-fund input{ accent-color:var(--mk-primary); width:16px; height:16px; flex:none; }
.mk-fund__ico{ color:var(--mk-text-muted); display:flex; flex:none; }
.mk-fund__n{ font-weight:700; font-size:13px; color:#111; }
.mk-fund__m{ font-size:12px; color:var(--mk-primary); }
.mk-scope__count{ font-size:12px; color:var(--mk-text-muted); margin-top:6px; }
.mk-badge--scope{ background:#EEF2FF; color:#4338CA; }

/* --- Contratos de Futuros / Wizard --- */
.mk-badge--fisica{ background:#7C3AED; }
.mk-badge--financiera{ background:#3981F6; }
.mk-mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:800; color:var(--mk-primary); }
.mk-modal--wizard{ width:min(720px,100%); }
.mk-modal__sub{ font-size:12.5px; color:var(--mk-text-muted); padding:0 20px 12px; margin-top:-6px; }
.mk-wizsteps{ display:flex; align-items:flex-start; justify-content:center; gap:6px; padding:6px 0 20px; }
.mk-wizstep{ display:flex; flex-direction:column; align-items:center; text-align:center; width:150px; }
.mk-wizstep__n{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  font-weight:800; font-size:15px; background:#E5E7EB; color:var(--mk-text-muted); transition:.2s; }
.mk-wizstep.on .mk-wizstep__n{ background:var(--mk-primary); color:#fff; box-shadow:0 0 0 4px var(--mk-primary-50); }
.mk-wizstep.done .mk-wizstep__n{ background:var(--mk-success); color:#fff; }
.mk-wizstep__t{ font-weight:700; font-size:13px; color:#111; margin-top:8px; }
.mk-wizstep.on .mk-wizstep__t{ color:var(--mk-primary); }
.mk-wizstep__d{ font-size:11.5px; color:var(--mk-text-muted); line-height:1.35; }
.mk-wizline{ flex:none; width:44px; height:2px; background:#E5E7EB; margin-top:22px; border-radius:2px; }
.mk-wizline.done{ background:var(--mk-success); }
.mk-wizpanel{ border:1px solid var(--mk-primary-100); border-radius:var(--mk-radius); padding:18px; background:#FDFCFF; }
.mk-wizfoot{ display:flex; justify-content:space-between; gap:10px; padding:14px 20px; border-top:1px solid var(--mk-border); }
.mk-summary{ border:1px solid var(--mk-border-2); border-radius:8px; background:#fff; padding:12px 14px; margin-top:14px; }
.mk-summary h4{ margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mk-primary); }

/* --- Configuracion Economica (comisiones) --- */
.mk-badge--otc{ background:#3981F6; }
.mk-badge--std{ background:#15803D; }
.mk-badge--opc{ background:#F1F5F9; color:#475569; }
.mk-badge--obl{ background:var(--mk-danger); }
.mk-badge--pct{ background:#3981F6; }
.mk-badge--contrato{ background:#15803D; }
.mk-badge--moneda{ background:#F1F5F9; color:#334155; font-family:ui-monospace,Menlo,Consolas,monospace; }
.mk-badge--dot::before{ content:"\25CF"; margin-right:6px; font-size:9px; opacity:.85; }
.mk-badge--incompleta{ background:var(--mk-danger); }
.mk-badge--pend{ background:var(--mk-success); }
.mk-nodisp{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--mk-text-muted); }
.mk-nodisp::before{ content:""; width:9px; height:9px; border-radius:50%; background:#F87171; }
.mk-table td .mk-num{ font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; }
.mk-table--compact tbody td{ vertical-align:middle; }
.mk-th-info{ display:inline-flex; align-items:center; gap:6px; }

/* --- Ciclo de Vida --- */
.mk-na{ color:var(--mk-text-faint); font-size:12.5px; }
.mk-badge--check::before{ content:"\2713"; margin-right:6px; font-weight:900; }
.mk-statelist{ display:flex; flex-direction:column; gap:10px; }
.mk-stateitem{ display:flex; align-items:center; gap:12px; border:1px solid var(--mk-border-2);
  border-radius:8px; background:#FAFAFC; padding:12px 16px; font-weight:700; color:#111; font-size:13.5px; }
.mk-stateitem__c{ color:var(--mk-success); display:flex; flex:none; }
.mk-stateitem__n{ margin-left:auto; font-size:11.5px; font-weight:600; color:var(--mk-text-muted); }

/* --- Reglas Ciclo de Vida --- */
.mk-rt-id{ font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:800; color:var(--mk-primary); font-size:12.5px; }
.mk-trans{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; }
.mk-trans__a{ color:var(--mk-text-muted); }
.mk-trans__b{ font-weight:700; color:#111; }
.mk-trans__ar{ color:var(--mk-text-faint); }
.mk-badge--proc{ background:#3981F6; }
.mk-badge--ambos{ background:#F1F5F9; color:#475569; }
.mk-badge--aprob{ background:#E8A317; }
.mk-badge--no{ background:#F1F5F9; color:#64748B; }
.mk-badge--no::before{ content:"\00D7"; margin-right:5px; font-weight:900; }
.mk-warnsi{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--mk-warning); }
.mk-iconbtn--x{ background:transparent; color:var(--mk-danger); font-size:17px; font-weight:800; }
.mk-iconbtn--x:hover{ background:var(--mk-danger-soft); }
.mk-rtsec{ margin-top:18px; }
.mk-rtsec h4{ margin:0 0 10px; font-size:13.5px; font-weight:800; color:#111; }
.mk-rtline{ display:flex; align-items:flex-start; gap:10px; font-size:13px; padding:5px 0; color:var(--mk-text); }
.mk-rtline .c{ color:var(--mk-success); flex:none; display:flex; }
.mk-rtline .p{ color:var(--mk-primary); flex:none; display:flex; }
.mk-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.mk-chip{ background:#F1F5F9; color:#334155; border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600; }

/* --- Modelos de Garantia --- */
.mk-fset{ border:1px solid var(--mk-border); border-radius:var(--mk-radius); padding:16px; margin-bottom:14px; background:#fff; }
.mk-fset__h{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.mk-fset__n{ width:22px; height:22px; flex:none; border-radius:6px; display:grid; place-items:center;
  background:var(--mk-primary); color:#fff; font-size:12px; font-weight:800; }
.mk-fset__t{ font-weight:800; font-size:14px; color:#111; }
.mk-checkgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px){ .mk-checkgrid{ grid-template-columns:1fr; } }
.mk-checkbox-card{ display:flex; align-items:center; gap:10px; border:1px solid var(--mk-border-2);
  border-radius:8px; padding:11px 14px; cursor:pointer; font-size:13px; color:var(--mk-text); background:#fff; transition:.15s; }
.mk-checkbox-card:hover{ border-color:var(--mk-primary-200); }
.mk-checkbox-card.sel{ border-color:var(--mk-primary); background:var(--mk-primary-50); font-weight:700; }
.mk-checkbox-card input{ accent-color:var(--mk-primary); width:16px; height:16px; flex:none; }
.mk-radiorow{ display:flex; gap:22px; align-items:center; }
.mk-tagsoft{ display:inline-block; background:#F1F5F9; color:#334155; border-radius:6px;
  padding:4px 10px; font-size:12px; font-weight:600; margin:2px 4px 2px 0; }
.mk-badge--oblig{ background:var(--mk-warning-soft); color:#92400E; }
.mk-badge--estado-soft{ background:var(--mk-primary-50); color:var(--mk-primary); }

/* --- Reglas de Margen --- */
.mk-emptybig{ text-align:center; padding:44px 20px; }
.mk-emptybig__ico{ color:#94A3B8; margin-bottom:12px; }
.mk-emptybig__t{ font-size:14.5px; font-weight:600; color:#475569; }
.mk-emptybig__d{ font-size:13px; color:var(--mk-primary); margin-top:4px; }
.mk-subhead{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:13.5px; color:#111; margin:6px 0 12px; }
.mk-subhead svg{ color:var(--mk-primary); flex:none; }
.mk-subhead--g svg{ color:var(--mk-success); }
.mk-subhead__sw{ margin-left:auto; font-size:12.5px; font-weight:600; color:var(--mk-text-muted); display:inline-flex; align-items:center; gap:8px; }
.mk-collrow{ display:grid; grid-template-columns:1fr 150px 34px; gap:10px; align-items:center; margin-bottom:10px; }
@media (max-width:640px){ .mk-collrow{ grid-template-columns:1fr 100px 30px; } }
.mk-collrow .rm{ background:transparent; border:0; color:var(--mk-danger); font-size:18px; cursor:pointer; border-radius:6px; }
.mk-collrow .rm:hover{ background:var(--mk-danger-soft); }
.mk-infobox{ border:1px solid var(--mk-primary-100); border-radius:var(--mk-radius); background:#FFFDF8;
  padding:14px 16px; display:flex; gap:12px; align-items:flex-start; }
.mk-infobox__i{ color:var(--mk-warning); flex:none; }
.mk-infobox b{ color:#92400E; }
.mk-infobox__t{ font-weight:800; color:#7C3A06; font-size:13px; margin-bottom:6px; }
.mk-infobox ul{ margin:0; padding-left:18px; font-size:12.5px; color:#7C3A06; line-height:1.75; }

/* --- Reglas de Liquidacion --- */
.mk-badge--warn2{ background:var(--mk-warning); }
.mk-badge--soft2{ background:#F1F5F9; color:#475569; }
.mk-badge--crit{ background:var(--mk-danger); }
.mk-swpill{ width:44px; height:22px; border-radius:999px; background:#D1D5DB; position:relative; display:inline-block; cursor:pointer; transition:.2s; }
.mk-swpill.on{ background:var(--mk-primary); }
.mk-swpill::after{ content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.2s; }
.mk-swpill.on::after{ transform:translateX(22px); }
.mk-impacts{ display:flex; flex-direction:column; gap:5px; align-items:flex-start; }
.mk-flow{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-top:8px; font-size:12px; }
.mk-flow .mk-badge{ white-space:nowrap; }

/* --- Reglas Fiscales por Instrumento --- */
.mk-tick{ display:inline-flex; color:var(--mk-success); }
.mk-cross{ display:inline-flex; color:#94A3B8; }
.mk-badge--fiscal{ background:var(--mk-warning); }

/* ============================================================
   SINCRONIA DE DISENO CON LA PLATAFORMA REAL (Lending)
   Homogeneiza todas las pantallas del prototipo con el look
   productivo: fieldsets Filtros/Informacion, header de tabla
   morado, triada de acciones, buscador con selector de campo,
   CSV/Excel solidos, paginacion numerada y pills de estado.
   NO cambiar: es la referencia unica de la plataforma SaaS.
   ============================================================ */
.mk-fieldset{ border:1px solid var(--mk-primary-100); border-radius:var(--mk-radius); padding:16px; margin:0 0 16px; min-inline-size:0; max-width:100%; }
.mk-fieldset > .mk-card{ border:0; box-shadow:none; padding:0; min-width:0; }
.mk-fieldset > legend{ font-size:12px; color:var(--mk-primary); padding:0 6px; font-weight:600; }
.mk-fieldset .mk-fieldset{ margin-bottom:0; }
.mk-fieldset > .mk-datatable__toolbar{ border:1px solid var(--mk-primary-100); border-radius:var(--mk-radius); padding:12px 14px; margin-bottom:14px; }

/* Tabla: header morado solido, filas compactas */
.mk-table thead th{ background:var(--mk-primary); font-weight:700; font-size:12.5px; padding:12px 14px; }
.mk-table thead th:first-child, .mk-table thead th:last-child{ border-radius:0; }
.mk-tablewrap{ border-radius:6px; border:1px solid var(--mk-primary-100); }
.mk-table tbody tr:last-child td{ border-bottom:0; }

/* Triada de acciones */
.mk-table .actions, .mk-acts{ display:flex; gap:6px; align-items:center; }
.mk-iconbtn{ width:30px; height:28px; border:1px solid var(--mk-primary-200); background:var(--mk-surface); }
.mk-iconbtn--view{ background:var(--mk-surface); color:var(--mk-primary); }
.mk-iconbtn--edit{ background:var(--mk-surface); color:var(--mk-primary); border-color:var(--mk-primary-200); }
.mk-iconbtn--delete{ background:var(--mk-surface); color:var(--mk-danger); border-color:#F5C2C2; }
.mk-iconbtn--view:hover{ background:var(--mk-primary-50); }
.mk-iconbtn--edit:hover{ background:var(--mk-primary-50); }
.mk-iconbtn--delete:hover{ background:var(--mk-danger-soft); }
.mk-iconbtn--dark{ background:var(--mk-slate-btn); color:#fff; border-color:var(--mk-slate-btn); }

/* Buscador con selector de campo + boton lupa */
.mk-searchgroup{ display:flex; align-items:stretch; gap:8px; }
.mk-searchgroup__box{ display:flex; align-items:stretch; border:1px solid var(--mk-primary-200);
  border-radius:var(--mk-radius-sm); overflow:hidden; background:var(--mk-surface); }
.mk-searchgroup__box .mk-input{ border:0; min-width:230px; }
.mk-searchgroup__box .mk-input:focus{ box-shadow:none; }
.mk-searchgroup__field{ display:flex; align-items:center; border-left:1px solid var(--mk-primary-100); }
.mk-searchgroup__field select{ appearance:none; -webkit-appearance:none; border:0; background:transparent;
  font:inherit; font-size:12.5px; color:var(--mk-text); padding:0 24px 0 12px; cursor:pointer; outline:none; }
.mk-searchgroup__field{ position:relative; }
.mk-searchgroup__field::after{ content:""; position:absolute; right:10px; top:50%; width:7px; height:7px;
  border-right:2px solid var(--mk-text-muted); border-bottom:2px solid var(--mk-text-muted);
  transform:translateY(-70%) rotate(45deg); pointer-events:none; }
.mk-searchgroup__field .mk-select--plain{ border:0; background:transparent; height:auto; padding:0 4px;
  font-size:12.5px; color:var(--mk-text-muted); box-shadow:none; }
.mk-searchgroup__go{ display:grid; place-items:center; width:34px; border:0; border-radius:var(--mk-radius-sm);
  background:var(--mk-primary); color:#fff; cursor:pointer; }
.mk-searchgroup__go:hover{ background:var(--mk-primary-dark); }

/* Exportar: CSV pizarra / Excel verde, con icono de nube */
.mk-export .mk-btn{ padding:7px 13px; font-size:12.5px; border:0; }
.mk-export .mk-btn--csv{ background:var(--mk-slate-btn); color:#fff; }
.mk-export .mk-btn--csv:hover{ background:#4f5d72; }
.mk-export .mk-btn--xls{ background:var(--mk-excel); color:#fff; }
.mk-export .mk-btn--xls:hover{ background:#0b5e30; }

/* Pie de tabla con paginacion numerada */
.mk-datatable__foot{ margin-top:12px; }
.mk-pagination button{ min-width:30px; height:30px; }
.mk-pagination .nav{ color:var(--mk-primary); font-weight:700; }

/* Pill de estado ancho como en la plataforma */
.mk-table td .mk-badge--wide{ min-width:180px; border-radius:var(--mk-radius-pill); }
#loBody td .mk-badge--wide{ min-width:0; padding-left:10px; padding-right:10px; }
#loBody td:first-child b, #apBody td:first-child b, #loBody td:nth-child(2) b, #apBody td:nth-child(2) b{ white-space:nowrap; }

/* Tooltips de encabezado: se despliegan hacia abajo para no recortarse */
.mk-table thead .mk-tooltip__bubble{ bottom:auto; top:150%; }
.mk-table thead th{ overflow:visible; }
.mk-acts .mk-tooltip__bubble{ white-space:nowrap; }
.mk-kebab{ background:transparent; border:0; cursor:pointer; color:var(--mk-text-muted); font-size:18px; line-height:1;
  padding:4px 9px; border-radius:6px; }
.mk-kebab:hover{ background:var(--mk-primary-50); color:var(--mk-primary); }
.mk-menu{ position:absolute; z-index:75; background:#fff; border:1px solid var(--mk-border); border-radius:8px;
  box-shadow:var(--mk-shadow-lg); padding:6px; min-width:160px; }
.mk-menu button{ display:block; width:100%; text-align:left; background:none; border:0; font:inherit; font-size:13px;
  padding:9px 12px; border-radius:6px; cursor:pointer; color:var(--mk-text); }
.mk-menu button:hover{ background:var(--mk-primary-50); }
.mk-menu button.danger{ color:var(--mk-danger); }
.mk-menu button.danger:hover{ background:var(--mk-danger-soft); }
.mk-switchbox{ display:flex; align-items:center; gap:14px; background:#F7F5FA; border-radius:8px; padding:12px 14px; margin:14px 0; }
.mk-switchbox__t{ font-weight:700; font-size:13px; color:#111; }
.mk-switchbox__d{ font-size:12px; color:var(--mk-text-muted); }











/* ============================================================
   PASADA HORIZONTAL GLOBAL
   El dominio se ve en pantallas anchas: la informacion se
   reparte a lo ancho en vez de apilarse. Menos scroll, mismo
   contenido.
   ============================================================ */
/* Fichas de datos y formularios: tantas columnas como quepan */
.mk-formgrid{ grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
/* Bloques de solo lectura (detalles): columnas mas estrechas */
.mk-formgrid:not(:has(input,select,textarea)){
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
/* Convenciones y fuentes: once campos de solo lectura, todos cortos. En
   pantalla ancha caben en cuatro columnas y el paso 1 deja de verse vacio. */
#ntFsConvenciones .mk-formgrid{ grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); }
#ntFsConvenciones .mk-input[readonly]{ background:#FBF7FE; }
.mk-formgrid .span2{ grid-column:1 / -1; }
@media (max-width:700px){ .mk-formgrid, .mk-formgrid:not(:has(input,select,textarea)){ grid-template-columns:1fr; } }
/* Fieldsets y tarjetas mas compactos en vertical */
.mk-section .mk-fieldset{ margin-bottom:14px; }
.mk-detail{ padding:6px 0; }
/* Utilidad: dos bloques lado a lado */
.mk-cols2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(460px,1fr)); gap:16px; align-items:start; }
.mk-cols2 > *{ min-width:0; margin-bottom:0 !important; }
.mk-cols3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; align-items:start; }
.mk-cols3 > *{ min-width:0; margin-bottom:0 !important; }
/* Rejillas internas dentro de una columna estrecha: se reacomodan
   en vez de desbordarse sobre la columna vecina. */
.mk-cols2 .mk-grid, .mk-cols3 .mk-grid,
.mk-cols2 .mk-kpis, .mk-cols3 .mk-kpis{
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr)) !important; }
.mk-cols2 .mk-card, .mk-cols3 .mk-card{ min-width:0; overflow:hidden; }

/* ============================================================
   TOOLTIPS SIN RECORTE
   La burbuja ya no se pinta dentro de su celda o su tarjeta: la
   Plataforma la dibuja en una capa por encima de todo y la
   reubica para que nunca quede fuera de la pantalla ni cortada
   por el borde de una tabla, una columna o un modal.
   ============================================================ */
.mk-tooltip__bubble{ display:none !important; }
#mkTipPop{
  position:fixed; z-index:99999; display:none; pointer-events:none;
  background:#1f2937; color:#fff; font-size:11.5px; line-height:1.45;
  padding:6px 10px; border-radius:6px; white-space:nowrap;
  box-shadow:0 8px 24px rgba(17,24,39,.28); max-width:min(340px,92vw); }
#mkTipPop.is-wide{ white-space:normal; width:280px; text-align:left; padding:9px 11px; font-weight:400; }
#mkTipPop b{ color:#fff; }
/* Validaciones previas del cierre: rejilla en vez de lista apilada */
.mk-vgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:10px; }
.mk-vgrid .mk-band{ margin:0; align-items:flex-start; }
.mk-vgrid .mk-band__tag{ padding:3px 6px; }
.mk-vgrid .mk-band > div{ min-width:0; }
.mk-vitem--ok{ background:#F7FBF8; border-left-color:#9BC7A8; color:#3f5346; }
.mk-vitem--ok .mk-band__tag{ background:#9BC7A8; }

/* Densidad de tabla: mismas columnas, filas mas bajas */
.mk-table tbody td{ padding:7px 12px; }
.mk-table thead th{ padding:9px 12px; }
.mk-table td .mk-badge{ padding:2px 8px; font-size:11px; }
.mk-table td .mk-acts .mk-iconbtn, .mk-table td .mk-actbtn{ padding:4px 6px; }
.mk-table td .mk-help{ font-size:11px; line-height:1.35; }

/* Acordeones de modulos transversales en dos columnas */
.mk-section > .mk-accordion{ margin-bottom:12px; }
.mk-accgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(520px,1fr)); gap:14px; align-items:start; }
.mk-accgrid > .mk-accordion{ margin-bottom:0; min-width:0; }

/* Filtros en una sola fila compacta */
.mk-filters, .mk-tplfilters{ align-items:flex-end; }

/* Listas de chips (verificaciones, impactos): a lo ancho, no en columna */
.mk-impacts{ flex-direction:row; flex-wrap:wrap; gap:6px 8px; }

/* ============================================================
   FILAS DE UNA SOLA LINEA
   La tabla es para comparar y encontrar; el detalle completo de
   un registro se lee en el modal "Ver". Cada celda ocupa una
   linea: si el texto no cabe, se recorta con puntos suspensivos
   y el valor completo esta en el modal (y en el tooltip nativo).
   ============================================================ */
.mk-tablewrap .mk-table tbody td{
  white-space:nowrap; max-width:300px; overflow:hidden; text-overflow:ellipsis;
  vertical-align:middle; }
/* La segunda linea descriptiva pasa al modal de detalle */
.mk-tablewrap .mk-table tbody td > .mk-help{ display:none !important; }
/* Celdas de acciones, casillas y badges: sin recorte */
.mk-tablewrap .mk-table tbody td:has(.mk-acts),
.mk-tablewrap .mk-table tbody td:has(button),
.mk-tablewrap .mk-table tbody td:has(input){
  max-width:none; overflow:visible; }
.mk-tablewrap .mk-table tbody td .mk-badge{ white-space:nowrap; }
/* Grupos de chips y de acciones dentro de una celda: una sola linea.
   La lista completa se lee en el modal de detalle. */
.mk-tablewrap .mk-table tbody td .mk-impacts{
  display:inline-flex; flex-wrap:nowrap; vertical-align:middle; gap:4px; }
.mk-tablewrap .mk-table tbody td .mk-acts{ flex-wrap:nowrap; }

/* En Setup los contadores no aportan: la parametrizacion se lee en la tabla */
[id^="view-setup-"] .mk-kpis{ display:none !important; }

/* ============================================================
   BOTONES DE ACCION
   Un solo estilo en todo el prototipo: cuadro redondeado de
   color solido con el icono en blanco. Ver en morado de marca,
   Editar en magenta, Inactivar o Eliminar en rojo. El estado
   deshabilitado conserva el color en un tono claro para que la
   fila siga leyendose igual.
   ============================================================ */
.mk-acts{ display:flex; gap:6px; align-items:center; }
.mk-table .actions{ display:flex; gap:6px; align-items:center; }
.mk-iconbtn,
.mk-table .mk-iconbtn,
.mk-table td .mk-acts .mk-iconbtn{
  display:inline-grid; place-items:center; width:32px; height:32px;
  border:0; border-radius:9px; cursor:pointer; padding:0;
  background:var(--mk-primary); color:#fff;
  transition:filter .12s ease, opacity .12s ease;
}
.mk-iconbtn svg{ stroke:#fff; }
.mk-iconbtn:hover{ filter:brightness(1.12); }
.mk-iconbtn--view, .mk-table .mk-iconbtn--view, .mk-table td .mk-acts .mk-iconbtn--view{ background:#6A1B9A; }
.mk-iconbtn--edit, .mk-table .mk-iconbtn--edit, .mk-table td .mk-acts .mk-iconbtn--edit{ background:#C2185B; }
.mk-iconbtn--delete, .mk-table .mk-iconbtn--delete, .mk-table td .mk-acts .mk-iconbtn--delete{ background:#E23B3B; }
.mk-iconbtn--ok, .mk-table .mk-iconbtn--ok, .mk-table td .mk-acts .mk-iconbtn--ok{ background:#15803D; }
.mk-iconbtn--menu, .mk-table .mk-iconbtn--menu, .mk-table td .mk-acts .mk-iconbtn--menu{ background:#4B5563; }
/* Clonar y demas acciones sin color propio: gris de plataforma */
.mk-table td .mk-acts .mk-iconbtn:not([class*="mk-iconbtn--"]){ background:#6B7280; }
.mk-iconbtn--dark, .mk-table .mk-iconbtn--dark{ background:var(--mk-slate-btn); color:#fff; }
.mk-iconbtn[disabled], .mk-iconbtn.is-off{ cursor:not-allowed; opacity:.42; filter:none; }
.mk-iconbtn--x{ background:transparent; color:var(--mk-danger); }
.mk-iconbtn--x svg{ stroke:var(--mk-danger); }
/* El kebab de acciones por estado usa el mismo cuadro */
.mk-table td .mk-kebab{
  display:inline-grid; place-items:center; width:32px; height:32px;
  border:0; border-radius:9px; background:#4B5563; color:#fff;
  font-size:17px; line-height:1; padding:0; }
.mk-table td .mk-kebab:hover{ background:#374151; filter:brightness(1.1); }

/* Filtro de fecha: compacto y sin aire cuando no hay nada que decir */
[data-mkfecmsg]:empty{ display:none; margin:0; }
[data-mkfecmsg]{ margin:0 0 8px; }
.mk-filters input[type="date"], .mk-tplfilters input[type="date"]{ min-width:150px; max-width:180px; }
.mk-filters .mk-field, .mk-tplfilters .mk-field{ margin-bottom:0; }
.mk-tplfilters, .mk-filters{ padding-top:6px; padding-bottom:6px; row-gap:8px; }
[hidden]{ display:none !important; }
.mk-kpis{ margin-bottom:10px; }
.mk-section .mk-fieldset{ margin-bottom:10px; }
.mk-kpi{ padding:8px 13px; }
.mk-section{ padding:14px 20px; }
/* Campo de fecha dentro de una fila de herramientas */
.mk-toolfecha{ flex-wrap:wrap; gap:12px; align-items:flex-end; }
.mk-toolfecha .mk-field{ margin-bottom:0; }
.mk-filters .mk-field--search, .mk-tplfilters .mk-field--search{ flex:1 1 220px; min-width:200px; }
.mk-filters .mk-label, .mk-tplfilters .mk-label{ margin-bottom:3px; }
.mk-cols2, .mk-cols3{ gap:12px; }
.mk-vgrid{ gap:8px; }
/* Ultimo ajuste de marco: el dominio cabe en una pantalla de 950 px */
.mk-page{ padding:14px 22px 28px; }
.mk-section{ padding:13px 18px; }
.mk-section .mk-fieldset{ padding:10px 13px; }
.mk-kpis{ margin-bottom:8px; }
.mk-headerpage{ margin-bottom:10px; }

/* La pantalla raiz de Derivados conserva sus acordeones a ancho completo */
#view-derivados .mk-accgrid{ display:block; }
#view-derivados .mk-accgrid > .mk-accordion{ margin-bottom:12px; }

/* Jerarquia entre las pestanas de Contabilidad y las de cada tabla */
