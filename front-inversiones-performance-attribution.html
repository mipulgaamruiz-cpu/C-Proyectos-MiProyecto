[data-tabgroup="conta"] .mk-tab{ font-size:14px; font-weight:700; padding:12px 16px; }
[data-panelgroup="conta"] .mk-tabs:not([data-tabgroup="conta"]) .mk-tab{ font-size:12.5px; padding:8px 14px; }
[data-panelgroup="conta"] .mk-headerpage h1{ font-size:18px; }
[data-panelgroup="conta"] > .mk-tabpanel > .mk-section{ padding:14px 16px; }
/* La fila completa abre el detalle */
.mk-tablewrap .mk-table tbody tr{ cursor:pointer; }
.mk-tablewrap .mk-table tbody tr:hover td{ background:#FBF7FE; }
.mk-tablewrap .mk-table tbody tr.mk-norow{ cursor:default; }
/* La tabla se desplaza en horizontal: la barra se deja siempre visible */
.mk-tablewrap{ scrollbar-width:thin; scrollbar-color:var(--mk-primary-100) transparent; }
.mk-tablewrap::-webkit-scrollbar{ height:9px; }
.mk-tablewrap::-webkit-scrollbar-thumb{ background:var(--mk-primary-100); border-radius:9px; }
.mk-tablewrap::-webkit-scrollbar-track{ background:#F4F1F8; border-radius:9px; }

/* ============================================================
   RECORTE DEL MARCO
   Margenes y rellenos del contenedor de pagina, encabezados,
   fieldsets y KPIs. No quita informacion: recupera el alto que
   se iba en aire alrededor de los bloques.
   ============================================================ */
.mk-page{ padding:14px 22px 28px; }
.mk-section{ padding:13px 18px; }
.mk-section .mk-headerpage{ margin-bottom:10px; }
.mk-section .mk-fieldset{ padding:10px 13px; margin-bottom:10px; }
.mk-section .mk-fieldset > legend{ margin-bottom:2px; }
.mk-kpis{ gap:10px; margin-bottom:8px; }
.mk-kpi{ padding:8px 13px; }
.mk-datatable__toolbar{ margin-bottom:8px; }
.mk-datatable__foot{ padding-top:8px; }
.mk-filters, .mk-tplfilters{ gap:12px; }
/* Modal de detalle de fila */
#modal-fila .mk-detail__label{ font-size:11px; }
#modal-fila .mk-detail{ border-bottom:1px solid var(--mk-border-2); }
/* ============================================================
   CONTEXTO DE FONDO · selector global + banda por pantalla
   ============================================================ */
.mk-fundsel{ margin-left:10px !important; }
.mk-fundbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 16px; padding:9px 14px; border-radius:10px;
  background:var(--mk-primary-50, #f6f0fb);
  border:1px solid rgba(106,27,154,.18);
  font-size:13px; color:var(--mk-text, #333);
}
.mk-fundbar__lb{ font-size:11px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
  color:var(--mk-primary, #6a1b9a); }
.mk-fundbar__v{ font-weight:700; color:var(--mk-primary, #6a1b9a); display:inline-flex; align-items:center; gap:6px; }
.mk-fundbar__m{ color:var(--mk-text-faint, #777); font-size:12.5px; }
.mk-fundbar__sep{ color:rgba(106,27,154,.35); }
.mk-fundbar--all{ background:#f4f6f8; border-color:#dfe4ea; }
.mk-fundbar--all .mk-fundbar__lb, .mk-fundbar--all .mk-fundbar__v{ color:#41525f; }
/* Alcance del cierre (EOD multi-fondo) */
.mk-eodscope{ display:flex; flex-wrap:wrap; gap:10px; }
.mk-eodscope__f{ display:flex; align-items:flex-start; gap:8px; padding:9px 12px; border-radius:10px;
  border:1px solid #e2e6ea; background:#fff; cursor:pointer; min-width:250px; }
.mk-eodscope__f:hover{ border-color:rgba(106,27,154,.45); }
.mk-eodscope__f input{ margin-top:3px; }
.mk-eodscope__n{ display:block; font-weight:700; font-size:13px; }
.mk-eodscope__m{ display:block; font-size:11.5px; color:var(--mk-text-faint,#777); }
tr[data-mkf-hide]{ display:none !important; }
td[data-mkf-td] .mk-badge{ white-space:nowrap; }
[data-mkf-campo]{ min-width:220px; }

/* ===== Extensiones del prototipo Front de inversiones (sobre el sistema mk-) ===== */
.i{width:18px;height:18px;flex:none;vertical-align:middle}.i.lg{width:26px;height:26px}.i.xl{width:44px;height:44px}
.mk-iconbtn svg{width:16px;height:16px}
.mk-btn svg{width:16px;height:16px}
.mk-page{max-width:none}
.ac-list{position:absolute;z-index:70;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid var(--mk-primary-100);border-radius:7px;box-shadow:var(--mk-shadow-lg);max-height:220px;overflow:auto;padding:4px}
.opt{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}.opt:hover{background:var(--mk-primary-50)}
#mkTip{position:fixed;z-index:400;background:#1f2937;color:#fff;font-size:11.5px;padding:5px 9px;border-radius:6px;max-width:280px;pointer-events:none;opacity:0;transition:opacity .12s}#mkTip.show{opacity:1}
.chart-txt{fill:#6b7280;font-size:11px}.chart-grid{stroke:#9ca3af;opacity:.25}.pie-lbl{fill:#1f2937}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-top:8px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.pos{color:#15803D}.neg{color:#DC2626}
.mk-help--error[hidden]{display:none}
.mk-field.grow{flex:1 1 auto}
.mk-modal--form .mk-formgrid{grid-template-columns:1fr 1fr}
@media (max-width:700px){.mk-modal--form .mk-formgrid{grid-template-columns:1fr}.mk-brand{display:none}}
.mk-sonner{z-index:300}
.mk-mt{margin-top:16px}
.mk-navitem .mk-tree__chev{margin-left:auto;display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--mk-text-muted);transition:transform .2s}
.mk-navitem .mk-tree__chev:hover{background:var(--mk-primary-100)}
.mk-navitem.active .mk-tree__chev{color:#fff}.mk-navitem.active .mk-tree__chev:hover{background:rgba(255,255,255,.2)}
.mk-navitem.open .mk-tree__chev{transform:rotate(180deg)}

 const sp=wp.reduce((a,b)=>a+b,0),sb=wb.reduce((a,b)=>a+b,0);wp=wp.map(x=>x/sp);wb=wb.map(x=>x/sb);
 const rb=cats.map((c,i)=>(0.004+r()*0.012+(i%2?0.002:0))*k), rp=rb.map(x=>x+(r()-0.42)*0.006*k);
 const RB=wb.reduce((a,w,i)=>a+w*rb[i],0), RP=wp.reduce((a,w,i)=>a+w*rp[i],0);
 const rows=cats.map((c,i)=>{const alloc=(wp[i]-wb[i])*(rb[i]-RB),sel=wb[i]*(rp[i]-rb[i]),inter=(wp[i]-wb[i])*(rp[i]-rb[i]);return {cat:c,wp:wp[i],wb:wb[i],rp:rp[i],rb:rb[i],alloc,sel,inter,tot:alloc+sel+inter}});

 for(let i=0;i<=n;i+=Math.max(1,Math.floor(n/60))){}

 for(let i=0;i<=n;i+=step){for(let j=0;j<(i?step:0);j++){const z=(r()-0.5)*0.0028;p=(1+p)*(1+drift*0.1+z)-1;b=(1+b)*(1+bdrift*0.1+z*0.85+(r()-0.5)*0.0006)-1}

function pieSVG(data){
 const W=334,Hh=200,cx=167,cy=100,R=100,tot=data.reduce((a,d)=>a+d.value,0);let a0=0,paths='',lbls='';
 const pt=(a,r)=>[cx+r*Math.cos(a),cy-r*Math.sin(a)];
 data.forEach((d,i)=>{const fr=d.value/tot,a1=a0+fr*2*Math.PI,[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),large=(a1-a0)>Math.PI?1:0,col=PALETTE[i%PALETTE.length];
  paths+=data.length===1?'<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="'+col+'" stroke="#fff"><title>'+esc(d.name)+': 100%</title></circle>':'<path stroke="#fff" fill="'+col+'" d="M '+x0+','+y0+' A '+R+','+R+',0,'+large+',0,'+x1+','+y1+' L '+cx+','+cy+' Z"><title>'+esc(d.name)+': '+pct(fr,1)+'</title></path>';
  const am=(a0+a1)/2,[lx,ly]=pt(am,R+12);lbls+='<text x="'+lx+'" y="'+ly+'" class="pie-lbl" font-size="12" font-weight="600" text-anchor="'+(Math.cos(am)>=0?'start':'end')+'" dominant-baseline="central">'+Math.round(fr*100)+'%</text>';a0=a1});
 return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" height="200" style="overflow:visible" role="img" aria-label="Gráfico circular">'+paths+lbls+'</svg>';
}
function lineSVG(pts,series){
 const W=1100,Hh=260,m={l:56,r:16,t:14,b:28},iw=W-m.l-m.r,ih=Hh-m.t-m.b;
 let mn=Infinity,mx=-Infinity;pts.forEach(p=>series.forEach(s=>{mn=Math.min(mn,p[s.k]);mx=Math.max(mx,p[s.k])}));const pad=(mx-mn)*0.1||0.001;mn-=pad;mx+=pad;
 const X=i=>m.l+iw*i/(pts.length-1),Y=v=>m.t+ih*(1-(v-mn)/(mx-mn));
 let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" class="chart-grid"/><text x="'+(m.l-6)+'" y="'+(y+4)+'" text-anchor="end" class="chart-txt">'+pct(v,1)+'</text>'}
 const nt=6;for(let i=0;i<nt;i++){const idx=Math.round((pts.length-1)*i/(nt-1));g+='<text x="'+X(idx)+'" y="'+(Hh-8)+'" text-anchor="middle" class="chart-txt">'+pts[idx].d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})+'</text>'}
 const lines=series.map(s=>'<polyline fill="none" stroke="'+s.c+'" stroke-width="2.2" stroke-linejoin="round" points="'+pts.map((p,i)=>X(i).toFixed(1)+','+Y(p[s.k]).toFixed(1)).join(' ')+'"/>').join('');
 const hov=pts.map((p,i)=>'<rect x="'+(X(i)-iw/pts.length/2)+'" y="'+m.t+'" width="'+(iw/pts.length)+'" height="'+ih+'" fill="transparent"><title>'+p.d.toLocaleDateString('es-ES')+' — '+series.map(s=>s.n+': '+pct(p[s.k],2)).join(' · ')+'</title></rect>').join('');
 return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" style="max-height:320px;display:block" role="img" aria-label="Rentabilidad acumulada">'+g+lines+hov+'</svg><div class="lgd">'+series.map(s=>'<span><i style="background:'+s.c+'"></i>'+esc(s.n)+'</span>').join('')+'</div>';
}
function hbarSVG(items,keys,colors,names){
 const W=760,rowH=34,m={l:190,r:20,t:10,b:10},Hh=m.t+m.b+items.length*rowH,iw=W-m.l-m.r;
 let mx=0;items.forEach(it=>{let pos=0,neg=0;keys.forEach(k=>{const v=it[k];if(v>=0)pos+=v;else neg+=v});mx=Math.max(mx,pos,-neg)});mx=mx||0.001;
 const zero=m.l+iw/2,sc=(iw/2)/mx;let g='<line x1="'+zero+'" x2="'+zero+'" y1="'+m.t+'" y2="'+(Hh-m.b)+'" stroke="currentColor" opacity=".4"/>';
 items.forEach((it,i)=>{const y=m.t+i*rowH+6;let p=zero,n=zero;g+='<text x="'+(m.l-8)+'" y="'+(y+12)+'" text-anchor="end" class="chart-txt">'+esc(it.cat)+'</text>';
  keys.forEach((k,j)=>{const v=it[k],w=Math.abs(v)*sc;if(v>=0){g+='<rect x="'+p+'" y="'+y+'" width="'+w+'" height="16" rx="2" fill="'+colors[j]+'"><title>'+names[j]+': '+bps(v)+'</title></rect>';p+=w}else{n-=w;g+='<rect x="'+n+'" y="'+y+'" width="'+w+'" height="16" rx="2" fill="'+colors[j]+'"><title>'+names[j]+': '+bps(v)+'</title></rect>'}})});
 return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" style="display:block" role="img" aria-label="Barras horizontales">'+g+'</svg><div class="lgd">'+names.map((n,j)=>'<span><i style="background:'+colors[j]+'"></i>'+n+'</span>').join('')+'</div>';
}
function wrapT(t){const w=t.split(' '),out=[''];w.forEach(x=>{if((out[out.length-1]+' '+x).trim().length>16)out.push(x);else out[out.length-1]=(out[out.length-1]+' '+x).trim()});return out.slice(0,3)}
function waterfallSVG(comps,total,totalLabel){
 const W=1100,Hh=250,m={l:20,r:20,t:22,b:62},iw=W-m.l-m.r,ih=Hh-m.t-m.b,n=comps.length+1,bw=iw/n*0.6;
 let run=0,lo=0,hi=0;const bars=comps.map(c=>{const s=run;run+=c.v;lo=Math.min(lo,s,run);hi=Math.max(hi,s,run);return {n:c.n,s,e:run,v:c.v}});lo=Math.min(lo,0);hi=Math.max(hi,run);
 const Y=v=>m.t+ih*(1-(v-lo)/(hi-lo||1)),X=i=>m.l+iw/n*i+(iw/n-bw)/2;
 const lab=(i,t)=>'<text x="'+(X(i)+bw/2)+'" y="'+(Hh-m.b+16)+'" text-anchor="middle" class="chart-txt">'+wrapT(t).map((s,k)=>'<tspan x="'+(X(i)+bw/2)+'" dy="'+(k?12:0)+'">'+esc(s)+'</tspan>').join('')+'</text>';
 let g='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="currentColor" opacity=".4"/>';
 bars.forEach((b,i)=>{const y1=Y(Math.max(b.s,b.e)),h=Math.abs(Y(b.s)-Y(b.e))||1;g+='<rect x="'+X(i)+'" y="'+y1+'" width="'+bw+'" height="'+h+'" rx="2" fill="'+(b.v>=0?'#22c55e':'#ef4444')+'"><title>'+esc(b.n)+': '+bps(b.v)+'</title></rect><text x="'+(X(i)+bw/2)+'" y="'+(y1-5)+'" text-anchor="middle" class="chart-txt">'+bps(b.v)+'</text>'+lab(i,b.n)});
 const i=bars.length,y1=Y(Math.max(0,total)),h=Math.abs(Y(0)-Y(total))||1;g+='<rect x="'+X(i)+'" y="'+y1+'" width="'+bw+'" height="'+h+'" rx="2" fill="#6a1b9a"><title>'+totalLabel+': '+bps(total)+'</title></rect><text x="'+(X(i)+bw/2)+'" y="'+(y1-5)+'" text-anchor="middle" class="chart-txt" style="font-weight:700">'+bps(total)+'</text>'+lab(i,totalLabel);
 return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" style="display:block" role="img" aria-label="Cascada de efectos">'+g+'</svg>';
}

function DataTable(host,o){
 const st={q:'',page:1,sort:o.defaultSort||null,dir:o.defaultDir||1,f:{},d1:'',d2:'',op:OPDATE};
 const rowsAll=()=>o.rows(st);

  if(o.dateRange){const a=st.d1?new Date(st.d1+'T00:00:00').getTime():null,b=st.d2?new Date(st.d2+'T23:59:59').getTime():null;rows=rows.filter(r=>{const t=r[o.dateRange.k];return (!a||t>=a)&&(!b||t<=b)})}

  if(st.sort){const c=o.cols.find(c=>c.h===st.sort);rows=rows.slice().sort((a,b)=>{const x=c.sv?c.sv(a):a[c.k],y=c.sv?c.sv(b):b[c.k];return (x>y?1:x<y?-1:0)*st.dir})}return rows}

  const body=rows.length?rows.map((r,i)=>'<tr data-i="'+i+'">'+(hasActs?'<td>'+actsHTML(o.acts(r),i)+'</td>':'')+o.cols.map(c=>'<td'+(c.cls?' class="'+c.cls+'"':'')+'>'+(c.html?c.html(r):esc(c.fmt?c.fmt(r[c.k]):r[c.k]))+'</td>').join('')+(o.estado?'<td>'+o.estado(r)+'</td>':'')+'</tr>').join(''):'<tr><td colspan="'+(o.cols.length+(hasActs?1:0)+(o.estado?1:0))+'"><div class="mk-empty">'+(o.empty||'Sin resultados')+'</div></td></tr>';

  const cl=$('[data-clear]',host);if(cl)cl.addEventListener('click',()=>{st.q='';st.f={};st.d1='';st.d2='';st.page=1;render()});

  $$('[data-act]',host).forEach(b=>b.addEventListener('click',()=>{const tr=b.closest('tr');o.onAct&&o.onAct(b.dataset.act,rows[+tr.dataset.i])}));

 render();return {render,state:st};

 const tot=rows.reduce((a,p)=>a+p.nominal,0)||1,sum=f=>rows.reduce((a,p)=>a+f(p),0);
 return {rows,tot,wam:sum(p=>p.nominal*p.rest)/tot,tasa:sum(p=>p.nominal*p.tasa)/tot,v7:sum(p=>p.rest<=7?p.nominal:0),n7:rows.filter(p=>p.rest<=7).length,liq1:sum(p=>p.rest<=1?p.nominal:0),dev:sum(p=>p.devDia)}}

 const exc=comps.reduce((a,c)=>a+c.v,0),pos=MM_POS.filter(p=>p.port===port),tot=pos.reduce((a,p)=>a+p.nominal,0);

 return {comps,exc,rb:0.0058*k,rp:0.0058*k+exc,wam:[wam,32+r()*10],tasa:[0.1045+r()*0.004,0.1030+r()*0.003],liq:[liq,0.1],conc:[conc,0.25]};

function reportData(name,st){
 const funds=st.port==='Todos'?FUNDS:[st.port],per=perKey(st.d1,st.d2),end=new Date(st.d2+'T12:00:00'),P=v=>({n:v,s:4}),N=v=>({n:v,s:2}),pb=v=>N(v*10000);
 let heads,rows=[];
 if(/inmobiliarios|TIR y MOIC|por perfil/.test(name))return vehReportData(name,st,per,end);
 if(/por producto/.test(name)){heads=['Portafolio','Producto','Retorno','Referencia','Efecto (pb)'];funds.forEach(p=>{const k=vehKind(p);if(k!=='inm'&&k!=='alt'){const b=brinson(p,per,'Macroactivo');[['RENTA FIJA','Renta fija'],['RENTA VARIABLE','Renta variable']].forEach(c=>{const x=b.rows.find(y=>new RegExp(c[0],'i').test(y.cat));if(x)rows.push([p,c[1],P(x.rp),P(x.rb),pb(x.tot)])});const a=mmAttr(p,per);rows.push([p,'Mercado monetario',P(a.rp),P(a.rb),pb(a.exc)]);const h=hedgeEffect(p,per);if(h)rows.push([p,'Derivados (cobertura)',P(h.cubierto),P(h.asset),pb(h.net)])}
   inmMetrics(p,per).forEach(x=>rows.push([p,'Inmobiliario · '+x.a.nombre,P(x.total),P(0),N(0)]));altMetrics(p).forEach(x=>rows.push([p,(x.a.clase==='Cartera'?'Lending · ':'Alternativas · ')+x.a.nombre,P(x.tir),P(0),N(0)]))})}
 else if(/Lending/.test(name)){heads=['Portafolio','Lote','Deudores','Saldo','Tasa promedio','Plazo restante (meses)','Mora > 90 días'];funds.filter(p=>carPort(p).length).forEach(p=>INSTRUMENTS.filter(a=>a.clase==='Cartera'&&a.port===p).forEach(a=>{const d=carDebtors(a),t=d.reduce((x,y)=>x+y.saldo,0);rows.push([p,a.nombre,N(d.length),N(t),P(d.reduce((x,y)=>x+y.tasa*y.saldo,0)/t/100),N(d.reduce((x,y)=>x+y.plazo*y.saldo,0)/t),P(d.filter(y=>y.mora>90).reduce((x,y)=>x+y.saldo,0)/t)])}))}
 else if(/Brinson/.test(name)){heads=['Portafolio','Categoría','Peso portafolio','Peso benchmark','Asignación (pb)','Selección (pb)','Interacción (pb)','Total (pb)'];funds.forEach(p=>{const b=brinson(p,per,'Macroactivo');b.rows.forEach(x=>rows.push([p,x.cat,P(x.wp),P(x.wb),pb(x.alloc),pb(x.sel),pb(x.inter),pb(x.tot)]));if(b.hedge)rows.push([p,'Efecto de la cobertura',P(0),P(0),N(0),N(0),N(0),pb(b.hedge.net)])})}
 else if(/comité/.test(name)){heads=['Portafolio','Rentabilidad','Benchmark','Exceso (pb)','Volatilidad','Tracking error','Information ratio','Sharpe','Máx. drawdown'];funds.forEach(p=>{const s=perfStats(p,per,end);rows.push([p,P(s.rp),P(s.rb),pb(s.ex),P(s.vol),P(s.te),N(s.ir),N(s.sharpe),P(s.dd)])})}
 else if(/participaci/.test(name)){heads=['Portafolio','Tipo de participación','Comisión E.A.','Rentabilidad neta del período','Valor de la unidad'];const T=[['Tipo A (institucional)',0.012],['Tipo B (persona natural)',0.0185],['Tipo C (corporativo)',0.015]];funds.forEach(p=>{const s=perfStats(p,per,end);T.forEach(t=>{const net=s.rp-t[1]*PERIODS[per].k;rows.push([p,t[0],P(t[1]),P(net),N(10000*(1+net))])})})}
 else if(/renta fija/.test(name)){const a0=fiAttr(funds[0],per);heads=['Portafolio'].concat(a0.comps.map(c=>c.n+' (pb)'),['Exceso total (pb)']);funds.forEach(p=>{const a=fiAttr(p,per);rows.push([p].concat(a.comps.map(c=>pb(c.v)),[pb(a.exc)]))})}
 else if(/clientes/.test(name)){heads=['Mandato','Valor del portafolio','Rentabilidad','Benchmark','Exceso (pb)'];(st.port==='Todos'?FUNDS.filter(x=>/DELEGADO/.test(x)):[st.port]).forEach(p=>{const s=perfStats(p,per,end),sv0=SENS.find(x=>x.port===p);rows.push([p,N(sv0?sv0.val:1e10+hash(p)%1e9),P(s.rp),P(s.rb),pb(s.ex)])})}
 else{heads=['Portafolio','Rentabilidad','Benchmark','Exceso (pb)'];funds.forEach(p=>{const s=perfStats(p,per,end);rows.push([p,P(s.rp),P(s.rb),pb(s.ex)])})}
 return {heads,rows};
}
